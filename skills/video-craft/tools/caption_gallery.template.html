<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>video-craft 字幕样式预设</title>
<style>
:root{--bg:#0b0a10;--panel:#15131d;--line:#2a2638;--ink:#f2eee4;--muted:#9a95a8;--accent:#ff8a3d}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f6f2ea;--panel:#fff;--line:#e4dccb;--ink:#1b140c;--muted:#6d6558;--accent:#d2622a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}
header{padding:28px 16px 12px;max-width:1200px;margin:0 auto}h1{margin:0 0 6px;font-size:26px}p.l{margin:0;color:var(--muted);max-width:760px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}input,button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}button{cursor:pointer}
.grid{max-width:1200px;margin:0 auto;padding:0 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.card img{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;background:#0d0b14}.m{padding:8px 10px;font-size:13px}.m b{display:block;font-size:14px}.m span{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);max-width:720px;width:92vw;padding:0}dialog::backdrop{background:rgba(0,0,0,.6)}
.dl{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:18px}@media(max-width:560px){.dl{grid-template-columns:1fr}}.dl img{width:100%;border-radius:10px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font:12.5px ui-monospace,Menlo,monospace;max-height:220px}.tag{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.note{color:var(--muted);font-size:13px;margin-top:10px}
</style></head><body>
<header><h1 id="h1"></h1><p class="l" id="lede"></p>
<div class="tools"><input id="q" type="search"><select id="fs"></select><select id="fc"></select><select id="fr"></select><button id="lang"></button></div></header>
<div class="grid" id="grid"></div>
<dialog id="dlg"><div class="dl"><img id="di" alt=""><div><h2 id="dt" style="margin:0 0 6px"></h2><div id="dtags"></div><div class="row"><button id="cb"></button><button id="cp"></button><button id="cx"></button></div><pre id="dc"></pre><p class="note" id="dn"></p></div></div></dialog>
<script>
const DATA=/*DATA*/[];
const T={zh:{h1:"字幕样式预设",lede:"从「剪映字幕预设」抽出的 657 款竖屏样式（位置 / 颜色 / 描边 / 阴影 / 入场·出场·循环动画），用自己的代码重画。预览是静帧（示范文字），动画是按名字归类的近似，真用前自己看一遍动态。",search:"搜索：动画名、段数…",all:"全部",segs:"段",dur:"秒",anim:"动画",font:"字体类别",cb:"复制代码",cp:"复制给 AI 的指令",cx:"关闭",toast:"已复制",note:"字体类别：serif=宋体类 · sans=黑体类 · hand=手写 / 毛笔类 · condensed=窄体。本库自带字体不含原预设字体，字形会不同。texts 按段顺序替换文字。",prompt:(d)=>`用 video-craft skill 剪我的口播。在我说到【这里填那个词】时用字幕样式预设「${d.id}」（${d.segs} 段，动画：${d.anims.join(" / ")||"无"}），texts 填我的原话。先跑 face_track.py + place_check.py，字不能遮住我的脸，需要时用 dy 上下移。`,tp:["1 段","2 段","3 段","4 段及以上"],sf:"段数",catAll:"分类：全部",realAll:"真实使用：全部",real1:"真实工程里用过",real5:"真实工程里用 ≥5 次",realTag:"真实使用"},
en:{h1:"Caption style presets",lede:"657 portrait styles extracted from a set of JianYing caption presets (position / colour / stroke / shadow / in-out-loop animation), redrawn in our own code. Previews are still frames with sample text; animations are name-based approximations, so check the motion before use.",search:"Search: animation name, segments…",all:"All",segs:"seg",dur:"s",anim:"Animations",font:"Font class",cb:"Copy code",cp:"Copy AI prompt",cx:"Close",toast:"Copied",note:"Font class: serif · sans · hand (handwriting/brush) · condensed. The bundled fonts differ from the original preset fonts, so glyph shapes differ. `texts` replace the text per segment in order.",prompt:(d)=>`Use the video-craft skill to edit my talking-head video. At the moment I say [fill in the word], use caption style preset "${d.id}" (${d.segs} segment(s), animations: ${d.anims.join(" / ")||"none"}), with my own words in texts. First run face_track.py + place_check.py; the text must never cover my face, shift it with dy if needed.`,tp:["1 seg","2 segs","3 segs","4+ segs"],sf:"Segments",catAll:"Category: all",realAll:"Real usage: all",real1:"Used in real projects",real5:"Used ≥5 times in real projects",realTag:"Real usage"}};
let lang=(()=>{try{return localStorage.getItem("vc-lang")||"zh"}catch(e){return "zh"}})(),cur=null;
const $=s=>document.querySelector(s),U=()=>T[lang];
function ui(){document.documentElement.lang=lang==="zh"?"zh-CN":"en";$("#h1").textContent=U().h1;$("#lede").textContent=U().lede;$("#q").placeholder=U().search;$("#lang").textContent=lang==="zh"?"EN":"中文";$("#cb").textContent=U().cb;$("#cp").textContent=U().cp;$("#cx").textContent=U().cx;$("#dn").textContent=U().note;const fs=$("#fs"),v=fs.value;fs.innerHTML=`<option value="0">${U().sf}: ${U().all}</option>`+U().tp.map((t,i)=>`<option value="${i+1}">${t}</option>`).join("");fs.value=v||"0";const fc=$("#fc"),cv=fc.value,cats={};DATA.forEach(d=>cats[d.cat]=(cats[d.cat]||0)+1);fc.innerHTML=`<option value="">${U().catAll}</option>`+Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<option value="${k}">${k} (${n})</option>`).join("");fc.value=cv||"";const fr=$("#fr"),rv=fr.value;fr.innerHTML=`<option value="0">${U().realAll}</option><option value="1">${U().real1}</option><option value="2">${U().real5}</option>`;fr.value=rv||"0"}
function match(d){const r=$("#fr").value;if(r==='1'&&!(d.real&&d.real.n>0))return false;if(r==='2'&&!(d.real&&d.real.n>=5))return false;const c=$("#fc").value;if(c&&d.cat!==c)return false;const q=$("#q").value.trim().toLowerCase(),f=+$("#fs").value;if(f&&(f===4?d.segs<4:d.segs!==f))return false;return !q||(d.id+d.name+d.anims.join(" ")+d.segs).toLowerCase().includes(q)}
function render(){const L=DATA.filter(match);$("#grid").innerHTML=L.map(d=>`<button class="card" data-id="${d.id}"><img loading="lazy" src="caption-presets/${d.id}.jpg" alt=""><div class="m"><b>${d.name}</b><span>${d.id} · ${d.segs}${U().segs}</span></div></button>`).join("")}
$("#grid").addEventListener("click",e=>{const c=e.target.closest(".card");if(!c)return;cur=DATA.find(d=>d.id===c.dataset.id);$("#di").src=`caption-presets/${cur.id}.jpg`;$("#dt").textContent=`${cur.name} · ${cur.id}`;$("#dtags").innerHTML=[`${cur.segs} ${U().segs}`,`${cur.dur}${U().dur}`,...cur.fonts.map(f=>U().font+": "+f),...cur.anims,...(cur.real&&cur.real.n?[U().realTag+": "+cur.real.n+"×/"+cur.real.proj]:[])].map(t=>`<span class="tag">${t}</span>`).join("");$("#dc").textContent=cur.beat;$("#dlg").showModal()});
$("#cx").onclick=()=>$("#dlg").close();$("#dlg").addEventListener("click",e=>{if(e.target===$("#dlg"))$("#dlg").close()});
async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}$("#cb").dataset.t=1;const o=document.title;document.title=U().toast;setTimeout(()=>document.title=o,900)}
$("#cb").onclick=()=>cp(cur.beat);$("#cp").onclick=()=>cp(U().prompt(cur));$("#q").oninput=render;$("#fs").onchange=render;$("#fc").onchange=render;$("#fr").onchange=render;$("#lang").onclick=()=>{lang=lang==="zh"?"en":"zh";try{localStorage.setItem("vc-lang",lang)}catch(e){}ui();render()};
ui();render();
</script></body></html>

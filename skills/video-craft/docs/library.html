<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video-craft</title>
<meta name="description" content="口播剪出网感：文字版式 + 换场，每款都有预览、用法和代码。">
<style>
:root{
  --bg:#0B0912; --panel:#14111f; --panel2:#1b1729; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#ECE9F5; --muted:#9A93B5; --accent:#95D024; --accent-ink:#10140A; --purple:#8255FA; --soft:#B9A2FF; --warn:#FFBF17;
  --r:18px;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font:16px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--soft)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{padding:56px 0 28px;background:radial-gradient(ellipse 60% 120% at 20% 0%,rgba(130,85,250,.22),transparent 70%)}
.eyebrow{font:600 13px/1 ui-monospace,Menlo,monospace;color:var(--accent);letter-spacing:.08em;margin-bottom:14px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);max-width:640px;margin-top:14px;font-size:17px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:0 70px 0 18px;font:inherit;font-size:15px}
.search input:focus{outline:2px solid var(--purple);outline-offset:2px}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:12px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.safe{margin:22px 0 0;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;background:var(--panel);color:var(--muted);font-size:14px}
.safe b{color:var(--text)}
main{padding:28px 0 72px}
.count{color:var(--muted);font-size:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;display:flex;flex-direction:column;transition:transform .18s,border-color .18s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--soft)}
.card:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.thumb{position:relative;aspect-ratio:9/16;background:#0d0b16;overflow:hidden}
.thumb video,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:10px;top:10px;z-index:2;font:700 12px/1 ui-monospace,Menlo,monospace;padding:6px 9px;border-radius:999px;background:rgba(11,9,18,.78);border:1px solid var(--line2);color:var(--accent);backdrop-filter:blur(6px)}
.badge.scene{color:var(--soft)}
.badge.mo{color:var(--warn)}
.badge.th{color:#ff8fb1}
.badge.em{color:#ff6b6b}
.badge.mx{color:#7fe0ff}
.meta{padding:13px 14px 15px}
.meta h3{font-size:16px;line-height:1.35;font-weight:700}
.meta code{display:block;margin-top:3px;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.meta p{margin-top:8px;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
/* modal */
dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none;width:100%;height:100%}
dialog::backdrop{background:rgba(5,4,10,.82);backdrop-filter:blur(6px)}
.sheet{position:relative;max-width:980px;margin:min(5vh,36px) auto;background:var(--panel);border:1px solid var(--line2);border-radius:24px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);overflow:hidden;max-height:calc(100vh - 2*min(5vh,36px));overflow-y:auto}
.sheet .vid{background:#0d0b16;display:flex;align-items:center;justify-content:center}
.sheet video{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.body{padding:28px 28px 30px;display:flex;flex-direction:column;gap:18px;min-width:0}
.body h2{font-size:26px;line-height:1.25}
.body .id{font:13px ui-monospace,Menlo,monospace;color:var(--accent)}
.sec h4{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px}
.sec p{font-size:15px}
.sec.avoid h4{color:var(--warn)}
pre{background:#0d0b16;border:1px solid var(--line);border-radius:12px;padding:14px;font:12.5px/1.55 ui-monospace,Menlo,monospace;color:#d8d3ea;overflow:auto;max-height:220px;white-space:pre}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
.btn{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.close{position:absolute;right:14px;top:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(11,9,18,.8);color:var(--text);font-size:20px;cursor:pointer}
.nav{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.on{opacity:1}
.sfxsec{margin-top:64px;padding-top:36px;border-top:1px solid var(--line)}
.sfxsec h2{font-size:26px}
.sfxsec .lede{margin:8px 0 14px;max-width:760px}
.sfxsec .facts{display:grid;gap:8px;margin:14px 0 18px}
.sfxsec .facts p{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:14.5px}
.sfxsec .facts b{color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.sfx{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.sfx th,table.sfx td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.sfx th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.06em;background:var(--panel)}
table.sfx td code{font:12.5px ui-monospace,Menlo,monospace;color:var(--accent)}
table.sfx tr:last-child td{border-bottom:0}
.sfxsec .note{margin-top:10px;font-size:13px;color:var(--muted)}
.sfxsec .search{max-width:420px;margin-bottom:12px}
footer{border-top:1px solid var(--line);padding:30px 0 56px;color:var(--muted);font-size:14px}
footer ul{margin:10px 0 0 18px}
@media (max-width:760px){
  .sheet{grid-template-columns:1fr;margin:0;border-radius:0;max-height:100vh;height:100%}
  .sheet video{max-height:46vh;aspect-ratio:auto;object-fit:contain}
  .body{padding:20px 18px 28px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="eyebrow">VIDEO-CRAFT · SKILL LIBRARY</div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
  <div class="tools">
    <label class="search"><span class="sr" style="position:absolute;left:-9999px">搜索</span><input id="q" type="search" placeholder="" autocomplete="off"><kbd>⌘ K</kbd></label>
    <div class="chips" role="group" aria-label="分类">
      <button class="chip" data-f="all" aria-pressed="true"></button>
      <button class="chip" data-f="layout" aria-pressed="false"></button>
      <button class="chip" data-f="scene" aria-pressed="false"></button>
      <button class="chip" data-f="jj" aria-pressed="false"></button>
      <button class="chip" data-f="mo" aria-pressed="false"></button>
      <button class="chip" data-f="th" aria-pressed="false"></button>
      <button class="chip" data-f="em" aria-pressed="false"></button>
      <button class="chip" data-f="mx" aria-pressed="false"></button>
      <button class="chip" data-f="sk" aria-pressed="false"></button>
      <button class="chip" data-f="fx" aria-pressed="false"></button>
    </div>
    <button class="chip" id="lang" aria-label="Language" style="margin-left:auto"></button>
  </div>
  <div class="safe" id="safe"></div>
</div></header>

<main><div class="wrap">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <section class="sfxsec" id="sfxsec">
    <h2 id="sfx-title"></h2><p class="lede" id="sfx-lede"></p>
    <div class="facts"><p id="sfx-f1"></p><p id="sfx-f2"></p></div>
    <label class="search"><input id="sfx-q" type="search" autocomplete="off"></label>
    <div class="tablewrap"><table class="sfx"><thead><tr><th id="th-a"></th><th id="th-n"></th><th id="th-s"></th><th id="th-i"></th></tr></thead><tbody id="sfx-body"></tbody></table></div>
    <p class="note" id="sfx-note"></p>
  </section>
</div></main>

<footer><div class="wrap"><b style="color:var(--text)" id="limh"></b><ul id="lim"></ul></div></footer>

<dialog id="dlg" aria-label="版式详情">
  <div class="sheet" id="sheet" role="document">
    <button class="close" id="x" aria-label="关闭">×</button>
    <div class="vid"><video id="mv" muted loop playsinline autoplay></video></div>
    <div class="body">
      <div><div class="id" id="mid"></div><h2 id="mt"></h2></div>
      <div class="sec"><h4 id="h-use"></h4><p id="muse"></p></div>
      <div class="sec avoid"><h4 id="h-avoid"></h4><p id="mavoid"></p></div>
      <div class="sec"><h4 id="h-sfx"></h4><p id="msfx"></p></div>
      <div class="sec"><h4 id="h-code"></h4><pre id="mcode"></pre></div>
      <div class="actions">
        <button class="btn primary" id="cp-prompt"></button>
        <button class="btn" id="cp-code"></button>
        <div class="nav"><button class="btn" id="prev" aria-label="上一个">←</button><button class="btn" id="next" aria-label="下一个">→</button></div>
      </div>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = [{"id": "chest-big", "no": "#23", "zh": "胸口小字 + 大字", "use": "一句铺垫 + 一个要点词。最常用，每支口播至少 3 次。", "avoid": "连续 3 句都这样，会变成「全是重点＝没有重点」。", "sfx": "缩小 + 咚 / 撞击光", "snippet": "<ChestBig th={th} small=\"剪出网感的第一步\" big=\"删停顿\" at={0.4} until={3.4} />", "beat": "{\n \"kind\": \"chest-big\",\n \"props\": {\n  \"small\": \"剪出网感的第一步\",\n  \"big\": \"删停顿\",\n  \"at\": 0.4,\n  \"until\": 3.4\n }\n}"}, {"id": "strike-swap", "no": "#24", "zh": "划掉换说法", "use": "纠正一个常见误区：旧说法被划掉，新说法砸出来。", "avoid": "旧说法太长——划线要一笔划完，字数 ≤6。", "sfx": "划线=纸张抖动 · 新词=咚", "snippet": "<StrikeSwap th={th} lead=\"很多人以为\" old=\"特效越多越好\" at={0.3} strikeAt={1.3} next=\"节奏\" nextAt={2.0} until={3.5} />", "beat": "{\n \"kind\": \"strike-swap\",\n \"props\": {\n  \"lead\": \"很多人以为\",\n  \"old\": \"特效越多越好\",\n  \"at\": 0.3,\n  \"strikeAt\": 1.3,\n  \"next\": \"节奏\",\n  \"nextAt\": 2.0,\n  \"until\": 3.5\n }\n}"}, {"id": "left-stair", "no": "#53", "zh": "左齐阶梯", "use": "三步递进：原因 → 过程 → 结果。每行比上一行缩进，上一行变暗。", "avoid": "超过 3 行；每行字要短，关键词用大字。", "sfx": "每行一个「叮」，最后一行换重音", "snippet": "<LeftStair th={th} until={3.5} rows={[{ pre: '画面太', key: '平', at: 0.3 }, { pre: '字幕一直', key: '不变', at: 1.1 }, { pre: '观众', key: '划走了', at: 1.9, big: true }]} />", "beat": "{\n \"kind\": \"left-stair\",\n \"props\": {\n  \"until\": 3.5,\n  \"rows\": [\n   {\n    \"pre\": \"画面太\",\n    \"key\": \"平\",\n    \"at\": 0.3\n   },\n   {\n    \"pre\": \"字幕一直\",\n    \"key\": \"不变\",\n    \"at\": 1.1\n   },\n   {\n    \"pre\": \"观众\",\n    \"key\": \"划走了\",\n    \"at\": 1.9,\n    \"big\": true\n   }\n  ]\n }\n}"}, {"id": "a-to-b", "no": "#41", "zh": "A → B 因果", "use": "「越 A 越 B」「因为 A 所以 B」，用一个箭头把前后连起来。", "avoid": "A 和 B 各不超过 4 个字，否则箭头放不下。", "sfx": "A=轻 · 箭头=呼 · B=咚", "snippet": "<AtoB th={th} a=\"越乱\" b=\"越慢\" at={0.3} bAt={1.6} until={3.5} />", "beat": "{\n \"kind\": \"a-to-b\",\n \"props\": {\n  \"a\": \"越乱\",\n  \"b\": \"越慢\",\n  \"at\": 0.3,\n  \"bAt\": 1.6,\n  \"until\": 3.5\n }\n}"}, {"id": "two-column", "no": "#17", "zh": "两栏对比", "use": "两个方案 / 两种做法对照。中线先划下来，左右各出一组。", "avoid": "两边字数差太多会失衡；每栏 ≤ 3 行。", "sfx": "中线=嗖 · 左右各一个叮", "snippet": "<TwoColumn th={th} until={3.5} lineAt={0.3} left={{ pre: '新手一上来就', key: 'effect', tail: '加满', at: 0.5 }} right={{ pre: '高手先把', key: 'timing', tail: '对齐', at: 1.8 }} />", "beat": "{\n \"kind\": \"two-column\",\n \"props\": {\n  \"until\": 3.5,\n  \"lineAt\": 0.3,\n  \"left\": {\n   \"pre\": \"新手一上来就\",\n   \"key\": \"effect\",\n   \"tail\": \"加满\",\n   \"at\": 0.5\n  },\n  \"right\": {\n   \"pre\": \"高手先把\",\n   \"key\": \"timing\",\n   \"tail\": \"对齐\",\n   \"at\": 1.8\n  }\n }\n}"}, {"id": "bars", "no": "#9", "zh": "荧光条", "use": "两个并列要点，像荧光笔划过的重点（卖点、结果）。", "avoid": "条里只放 2–5 个字；超过 2 条会抢走人脸。", "sfx": "每条一个「叮」或收银机", "snippet": "<Bars th={th} until={3.5} lead=\"想要\" leadAt={0.3} bars={[{ text: '有节奏', at: 0.9 }, { text: '有重点', at: 1.8 }]} />", "beat": "{\n \"kind\": \"bars\",\n \"props\": {\n  \"until\": 3.5,\n  \"lead\": \"想要\",\n  \"leadAt\": 0.3,\n  \"bars\": [\n   {\n    \"text\": \"有节奏\",\n    \"at\": 0.9\n   },\n   {\n    \"text\": \"有重点\",\n    \"at\": 1.8\n   }\n  ]\n }\n}"}, {"id": "vertical-wall", "no": "#35", "zh": "右墙竖排", "use": "2–4 个字的重点词竖着贴右边，不挡脸，适合「情绪词 / 结论词」。", "avoid": "超过 4 个字；脸在右边时要换左墙。", "sfx": "每个字一下重音", "snippet": "<VerticalWall th={th} until={3.5} chars={[{ c: '别', at: 0.5 }, { c: '再', at: 0.9 }, { c: '乱', at: 1.3, tone: 'accent2' }, { c: '剪', at: 1.7, tone: 'accent2' }]} />", "beat": "{\n \"kind\": \"vertical-wall\",\n \"props\": {\n  \"until\": 3.5,\n  \"chars\": [\n   {\n    \"c\": \"别\",\n    \"at\": 0.5\n   },\n   {\n    \"c\": \"再\",\n    \"at\": 0.9\n   },\n   {\n    \"c\": \"乱\",\n    \"at\": 1.3,\n    \"tone\": \"accent2\"\n   },\n   {\n    \"c\": \"剪\",\n    \"at\": 1.7,\n    \"tone\": \"accent2\"\n   }\n  ]\n }\n}"}, {"id": "dark-question", "no": "#27", "zh": "压暗大问句", "use": "低声、反问、悬念。四周压暗，只留一个问句，镜头同时慢慢推近。", "avoid": "一支片最多 1–2 次，多了失去分量。", "sfx": "疑惑音，或完全静音", "snippet": "<DarkQuestion th={th} small=\"是不是我的素材\" big=\"不够好？\" at={0.3} bigAt={0.8} until={3.5} />", "beat": "{\n \"kind\": \"dark-question\",\n \"props\": {\n  \"small\": \"是不是我的素材\",\n  \"big\": \"不够好？\",\n  \"at\": 0.3,\n  \"bigAt\": 0.8,\n  \"until\": 3.5\n }\n}"}, {"id": "chapter", "no": "—", "zh": "章节清单 01/02", "use": "讲方法、讲步骤：大数字 + 标题 + 打勾的小卡片，画面上移让字放在胸口。", "avoid": "一次只讲一个编号；卡片 ≤ 2 张。", "sfx": "数字=咚 · 每张卡片=叮", "snippet": "<Chapter th={th} until={3.5} num=\"01\" title=\"先定节奏\" at={0.3} chips={[{ text: '字块 ≤ 1.5 秒', at: 1.1 }, { text: '留 1 拍呼吸', at: 1.7 }]} punch={{ text: '两个都要做', at: 2.4 }} />", "beat": "{\n \"kind\": \"chapter\",\n \"props\": {\n  \"until\": 3.5,\n  \"num\": \"01\",\n  \"title\": \"先定节奏\",\n  \"at\": 0.3,\n  \"chips\": [\n   {\n    \"text\": \"字块 ≤ 1.5 秒\",\n    \"at\": 1.1\n   },\n   {\n    \"text\": \"留 1 拍呼吸\",\n    \"at\": 1.7\n   }\n  ],\n  \"punch\": {\n   \"text\": \"两个都要做\",\n   \"at\": 2.4\n  }\n }\n}"}, {"id": "giant-fill", "no": "#25", "zh": "巨字填满", "use": "落点金句：头顶一个巨大的空心字，讲到关键句从下往上填满。", "avoid": "只用 1 个字；全片最多 1 次，留给最后一句。", "sfx": "空心出现=呼 · 填满=综艺咚", "snippet": "<GiantFill th={th} char=\"稳\" at={0.3} fillAt={1.6} until={3.5} />", "beat": "{\n \"kind\": \"giant-fill\",\n \"props\": {\n  \"char\": \"稳\",\n  \"at\": 0.3,\n  \"fillAt\": 1.6,\n  \"until\": 3.5\n }\n}"}, {"id": "typed-quote", "no": "#38", "zh": "圆窗逐字打出", "use": "金句 / 引用：黑底，上面圆形人像窗，下面一个字一个字打出你讲的话。", "avoid": "每行 ≤ 9 个字；字出现的时间要对上你讲那个字的时间。", "sfx": "打字声（每字一下）", "snippet": "<TypedQuote th={th} at={0.2} until={3.5} lines={[{ toks: toks('剪辑不是加特效', 0.5), size: 88 }, { toks: toks('是删掉多余的', 1.8, 0.12), size: 88 }, { toks: toks('废话', 2.7, 0.14), size: 170, tone: 'accent', pre: '「', post: '」' }]} />", "beat": ""}, {"id": "signature", "no": "—", "zh": "签名卡", "use": "片尾：名字 + 人设一句话 + 系列名。压暗底，不加重音效，留干净收尾。", "avoid": "别放多于 3 行；别再出新信息。", "sfx": "无（或一声很轻的叮）", "snippet": "<SignatureCard th={th} at={0.4} name=\"我是示例\" slogan={['不吹 AI，只讲', '真', 'AI']} tag=\"示例系列 · #1\" />", "beat": "{\n \"kind\": \"signature\",\n \"props\": {\n  \"at\": 0.4,\n  \"name\": \"我是示例\",\n  \"slogan\": [\n   \"不吹 AI，只讲\",\n   \"真\",\n   \"AI\"\n  ],\n  \"tag\": \"示例系列 · #1\"\n }\n}"}, {"id": "split-retention", "no": "换场", "zh": "上卡下脸 · 留存曲线", "use": "钩子 / 讲「没人看完」：上面一张曲线卡画出来，下面是你的人像窗。开头 3 秒给观众一个「画面钩子」，不要只有字幕。", "avoid": "卡里别放整段字，只放一个图 + 一个词；整支最多 2 次。", "sfx": "嗖 → 高科技显示 → 无奈（划走那一下）", "snippet": "<SplitScene th={th} a={0.2} b={SU - 0.2} src={faceVideo}>{(tt) => <RetentionCard th={th} t={tt} title=\"总是没人看完？\" />}</SplitScene>", "beat": ""}, {"id": "split-compare", "no": "换场", "zh": "上卡下脸 · 对比时间轴", "use": "「乱 vs 齐」「新手 vs 高手」：上面左右两个小图对比（✗ / ✓），下面是你在讲。", "avoid": "左右两边视觉量要差得明显（乱 vs 齐），不然看不出对比。", "sfx": "嗖 → 疑惑（乱）→ 正确（齐）", "snippet": "<SplitScene th={th} a={0.2} b={SU - 0.2} src={faceVideo}>{(tt) => <CompareCard th={th} t={tt} leftLabel=\"effect 加满\" rightLabel=\"timing 对齐\" leftAt={0.4} rightAt={1.7} />}</SplitScene>", "beat": ""}, {"id": "phone-swipe", "no": "换场", "zh": "手机划走", "use": "讲「观众划走」「没人看」：黑底里一部手机放着你的口播，右边三行字递进，说到关键句手机往上划走。", "avoid": "字最多三行、每行 ≤6 字（右边只剩 ~360px 宽）；别和左齐阶梯连着用。", "sfx": "气泡 → 点击 → 悬疑（不对劲）→ 刷（划走）", "snippet": "<PhoneSwipe th={th} a={0.2} b={SU - 0.1} src={faceVideo} swipeAt={3.3} lines={[{ text: '画面太平', at: 0.5 }, { text: '字幕一直不变', at: 1.3 }, { text: '观众就划走了', at: 2.3, big: true }]} />", "beat": ""}, {"id": "reporter", "no": "换场", "zh": "记者出镜（抠像站前面）", "use": "讲步骤 / 清单：黑底，上面一张章节卡，你被抠出来站在前面。需要逐帧抠像（macOS：Apple Vision）。", "avoid": "没有抠像就别用（预览里是占位人形）；卡片里一次只讲一个编号。", "sfx": "忽然出现 → 碗叮 → 提示音 → 正确", "snippet": "<Reporter th={th} a={0.2} b={SU - 0.1} matteRange={[-1, -1]} standIn>{(tt) => <ChapterCardBody th={th} t={tt} num=\"01\" title=\"先定节奏\" chips={[{ text: '字块 ≤ 1.5 秒', at: 1.0 }, { text: '留 1 拍呼吸', at: 1.8 }]} punch={{ text: '两个都要做', at: 2.6 }} />}</Reporter>", "beat": ""}, {"id": "pip-broll", "no": "精剪", "zh": "全屏素材 + 小人像窗（PIP）", "use": "讲到一个具体名词 / 画面（产品、场景、动物…）：素材铺满全屏，你缩成白边小圆窗继续讲。小窗位置 右上 / 左上 / 底中 轮换，别遮素材主体。", "avoid": "素材没有主体时别用（看起来空）；小窗别压住标签牌；同一位置别连用 3 次。", "sfx": "嗖（素材进）→ 气泡（小窗弹出）", "snippet": "<PipBroll th={th} a={0.2} b={SU - 0.1} src={fa ={0.2} until={3.7} />", "beat": "{\n \"kind\": \"top-title\",\n \"props\": {\n  \"line1\": \"口播剪辑\",\n  \"line2\": \"三步剪出网感\",\n  \"at\": 0.2,\n  \"until\": 3.7\n }\n}"}, {"id": "stack-list", "no": "骨架", "zh": "累加清单（旧条变暗）", "use": "讲 2–3 个要点：一条一条出现，新的一条出来时旧的变暗；最后一句金句大字压上去。", "avoid": "超过 3 条（带金句）或 4 条（不带）会超出胸口带；每条 ≤8 个字。", "sfx": "每条一个「叮」，金句一个重音", "snippet": "<StackList th={th} until={3.6} items={[{ text: '先删停顿', at: 0.4 }, { text: '再对节奏', at: 1.1 }, { text: '最后配音效', at: 1.8 }]} punch={{ text: '三步就够', at: 2.6 }} />", "beat": "{\n \"kind\": \"stack-list\",\n \"props\": {\n  \"until\": 3.6,\n  \"items\": [\n   {\n    \"text\": \"先删停顿\",\n    \"at\": 0.4\n   },\n   {\n    \"text\": \"再对节奏\",\n    \"at\": 1.1\n   },\n   {\n    \"text\": \"最后配音效\",\n    \"at\": 1.8\n   }\n  ],\n  \"punch\": {\n   \"text\": \"三步就够\",\n   \"at\": 2.6\n  }\n }\n}"}, {"id": "end-cta", "no": "骨架", "zh": "结尾行动（胶囊 + 箭头）", "use": "片尾告诉他下一步点哪里：蓝色胶囊按钮 + 指向左下角的箭头。几乎每条行业成片的结尾都有。", "avoid": "文案由用户给；没有账号 / 联系方式就别编。别和签名卡叠在一起（二选一，或胶囊在上、签名在下）。", "sfx": "一声很轻的「叮」，不要重音效", "snippet": "<EndCta th={th} label=\"找我聊聊\" hint=\"点左下角\" at={0.4} until={3.6} />", "beat": "{\n \"kind\": \"end-cta\",\n \"props\": {\n  \"label\": \"找我聊聊\",\n  \"hint\": \"点左下角\",\n  \"at\": 0.4,\n  \"until\": 3.6\n }\n}"}, {"id": "camera-punch", "no": "特效", "zh": "开场冲镜", "use": "视频第一秒：画面从 1.28 倍冲到 1.0 倍并回弹，带动态模糊。钩子的第一下，配一个嗖。", "avoid": "全片只用 1 次，放在开头；脸要在画面中间偏上，否则冲镜时脸会被推出去。", "sfx": "嗖 上扬（whoosh_up）", "snippet": "<Cam th={th} fx={[{ kind: 'punch', at: 0.1, dur: 1.2 }]}>\n<ChestBig th={th} small=\"开场第一秒\" big=\"冲进来\" at={0.5} until={3.4} />\n</Cam>", "beat": ""}, {"id": "camera-shake", "no": "特效", "zh": "冲击震动", "use": "重点词砸下的那一下，画面跟着震动 + 放大 1.06 回弹（剪映「抖动」）。只震画面，字不震。", "avoid": "一支片里最多 4–6 次，每次要对着一个重击点；别连续震。", "sfx": "撞击（hit）/ 轰（boom）", "snippet": "<Cam th={th} fx={[{ kind: 'shake', hits: [0.9, 2.2] }]}>\n<ChestBig th={th} small=\"第一击\" big=\"砸!\" at={0.9} until={2.1} />\n<ChestBig th={th} small=\"第二击\" big=\"再砸!\" at={2.2} until={3.5} />\n</Cam>", "beat": ""}, {"id": "camera-tvoff", "no": "特效", "zh": "电视关机", "use": "讲「广告一停，生意就停了」「一下子全没了」：画面压成一条线 → 一个点 → 黑，黑场一直到下一句。", "avoid": "黑场要给 until，不然一路黑到片尾；只在「消失 / 结束」的句子用。", "sfx": "低频下沉（sub_drop）", "snippet": "<Cam th={th} fx={[{ kind: 'tvoff', at: 1.2, until: 3.0 }]}>\n<ChestBig th={th} small=\"广告一停\" big=\"生意就停\" at={0.2} until={1.2} />\n</Cam>", "beat": ""}, {"id": "camera-send", "no": "特效", "zh": "缩进手机飞走", "use": "讲「把这条视频发给他」「转发」：整个画面缩进一支手机 → 停一下 → 往右上飞走。", "avoid": "背景用深色星空（Backdrop），别用白底；全片最多 1 次，留给转发 / 分享的号召。", "sfx": "嗖 上扬 + 拉链上滑", "snippet": "<Cam th={th} fx={[{ kind: 'send', at: 1.0, until: 3.2 }]}>\n<ChestBig th={th} small=\"发给身边的人\" big=\"转发\" at={0.1} until={1.0} />\n</Cam>", "beat": ""}, {"id": "camera-circle", "no": "特效", "zh": "画面变圆头像 + 周围圆圈", "use": "讲「身边的同行 / 团队 / 客户」：说话的人缩成圆头像，周围圆圈一个个弹出、连线连上他。「讲什么就画什么」的典型。", "avoid": "脸的位置要告诉它（face）；圆圈最多 6 个；别和字幕、大字同时出现太多。", "sfx": "啵 × N", "snippet": "<Cam th={th} fx={[{ kind: 'circle', at: 0.6, until: 4.0, popAt: 1.3, cy: 800, R: 220 }]} />", "beat": ""}, {"id": "white-flash", "no": "特效", "zh": "白闪", "use": "钩子那一下、换场、重击点：整屏白一下（0.22 秒）再退掉。常和冲镜、大字同帧。", "avoid": "一支片里最多 3–4 次；别用在安静的句子。", "sfx": "闪光（flash）", "snippet": "<ChestBig th={th} small=\"结果他开了\" big=\"8 单\" at={0.6} until={3.4} />\n<WhiteFlash at={0.6} />", "beat": "{\n \"kind\": \"white-flash\",\n \"props\": {\n  \"small\": \"结果他开了\",\n  \"big\": \"8 单\",\n  \"at\": 0.6,\n  \"until\": 3.4\n }\n}"}, {"id": "kinetic-line", "no": "特效", "zh": "逐词放大变色", "use": "一句话一拍一词：新词放大弹入，上一词缩小变暗留在上面；重点词用强调色 + 更大。适合开头的金句。", "avoid": "一句 ≤6 个词；每个词要对着他讲那个词的时间；别和字幕同时挤在胸口带。", "sfx": "啵 / 重点词用撞击", "snippet": "<KineticLine th={th} y={1010} words={[{ t: 0.3, text: '你的' }, { t: 0.8, text: '下一张单' }, { t: 1.5, text: '就在' }, { t: 2.0, text: '同行那里', hot: true }]} until={3.5} />", "beat": "{\n \"kind\": \"kinetic-line\",\n \"props\": {\n  \"y\": 1010,\n  \"words\": [\n   {\n    \"t\": 0.3,\n    \"text\": \"你的\"\n   },\n   {\n    \"t\": 0.8,\n    \"text\": \"下一张单\"\n   },\n   {\n    \"t\": 1.5,\n    \"text\": \"就在\"\n   },\n   {\n    \"t\": 2.0,\n    \"text\": \"同行那里\",\n    \"hot\": true\n   }\n  ],\n  \"until\": 3.5\n }\n}"}, {"id": "counter-slam", "no": "特效", "zh": "数字滚动砸下", "use": "具体数字（8 单、50 万、10 年）：从 0 滚到目标，越滚越慢，落地放大砸下 + 光晕。比直接出数字强很多。", "avoid": "一支片 1–3 个数字；数字要是他真讲的，不要编；后缀小字写单位。", "sfx": "嘀嘀 + 撞击", "snippet": "<CounterSlam th={th} to={8} at={0.2} land={1.7} top={420} suffix=\"单\" until={3.5} />", "beat": "{\n \"kind\": \"counter-slam\",\n \"props\": {\n  \"to\": 8,\n  \"at\": 0.2,\n  \"land\": 1.7,\n  \"top\": 420,\n  \"suffix\": \"单\",\n  \"until\": 3.5\n }\n}"}, {"id": "stamp", "no": "特效", "zh": "印章字", "use": "「全部都是 X」「已成交」「重点」：字像印章从大盖下来（2.2 倍 → 1 倍）+ 微倾。", "avoid": "字 ≤6 个；颜色用红 / 强调色，别和大字同色；一支片 1–2 次。", "sfx": "印章（stamp）", "snippet": "<Stamp th={th} text=\"全部成交\" at={0.8} until={3.4} y={1050} />", "beat": "{\n \"kind\": \"stamp\",\n \"props\": {\n  \"text\": \"全部成交\",\n  \"at\": 0.8,\n  \"until\": 3.4,\n  \"y\": 1050\n }\n}"}, {"id": "chat-dm", "no": "特效", "zh": "聊天框发送", "use": "讲「私信我 X」「留言 X」：底部弹出输入框 → 打字 → 发送 → 强调色气泡飞上去。号召动作的画面化。", "avoid": "字写他真讲的关键词（≤6 个字）；放在结尾引导；别再叠结尾胶囊。", "sfx": "打字 + 啵 + 提示", "snippet": "<ChatDM th={th} text=\"GPS\" at={0.2} sendAt={1.5} until={4.0} y={1000} />", "beat": "{\n \"kind\": \"chat-dm\",\n \"props\": {\n  \"text\": \"GPS\",\n  \"at\": 0.2,\n  \"sendAt\": 1.5,\n  \"until\": 4.0,\n  \"y\": 1000\n }\n}"}, {"id": "slot-row", "no": "特效", "zh": "空位一个个弹出", "use": "讲「至少 7 单」「十个名额」「目标」：下面摆出 N 个虚线空位，一个个弹出。", "avoid": "N ≤ 10；放在胸口带（y≈1050）；别压字幕。", "sfx": "啵 × N", "snippet": "<SlotRow th={th} n={7} y={1050} at={0.3} until={3.5} />", "beat": "{\n \"kind\": \"slot-row\",\n \"props\": {\n  \"n\": 7,\n  \"y\": 1050,\n  \"at\": 0.3,\n  \"until\": 3.5\n }\n}"}, {"id": "rapid-montage", "no": "特效", "zh": "截图快闪", "use": "用真截图当证据：每张 0.2 秒放大入 + 左右轻倾，最后一张停住，上面写「第 N 个」。真截图比任何动画有说服力。", "avoid": "截图要你自己准备（public 里，写路径和原图像素）；遮掉别人的名字和电话；别超过 12 张。", "sfx": "快门（camera）", "snippet": "<RapidMontage th={th} at={0.3} until={3.5} s  \"kind\": \"orbit-text\",\n \"props\": {\n  \"text\": \"AROUND · 环绕文字 · \",\n  \"at\": 0.2,\n  \"until\": 3.5\n }\n}"}, {"id": "scatter-text", "no": "特效", "zh": "散落文字（整行打散）", "use": "讲「散了 / 崩了 / 一团乱」：一行字排整齐，约 0.6 秒后每个字母带重力掉落、旋转、飘开，落到下面堆着。", "avoid": "字 ≤12 个；和 drop-text 不同，这个是一整行被打散。", "sfx": "咚", "snippet": "<ScatterText th={th} text=\"版本 2.0\" at={0.2} until={3.5} />", "beat": "{\n \"kind\": \"scatter-text\",\n \"props\": {\n  \"text\": \"版本 2.0\",\n  \"at\": 0.2,\n  \"until\": 3.5\n }\n}"}];
const I18N = {"entries": {"chest-big": {"title": "Chest line + big word", "use": "A setup line plus one key word. The most-used layout — at least 3 per talking-head video.", "avoid": "Three in a row turns into \"everything is the point = nothing is the point\".", "sfx": "Shrink-in + thud (`dong` / `peng`)"}, "strike-swap": {"title": "Strike out, swap the claim", "use": "Correct a common misconception: the old claim gets crossed out, the new one slams in.", "avoid": "Keep the old claim short (≤6 characters) so the strike lands in one stroke.", "sfx": "Strike = paper rustle (`sword`/`paper`) · new word = stamp/thud (`stamp`)"}, "left-stair": {"title": "Left-aligned stair", "use": "Three-step progression: cause → process → result. Each line indents further and the previous line dims.", "avoid": "More than 3 lines; keep each line short and put the keyword in big type.", "sfx": "One ding per line, a heavier hit on the last line"}, "a-to-b": {"title": "A → B (cause and effect)", "use": "\"The more A, the more B\" / \"because A, therefore B\" — one arrow joins before and after.", "avoid": "A and B ≤ 4 characters each, or the arrow has no room.", "sfx": "A soft · arrow whoosh · B thud (`dong2`)"}, "two-column": {"title": "Two-column compare", "use": "Two options side by side. The centre line draws first, then one block on each side.", "avoid": "Wildly uneven text lengths look lopsided; keep each column ≤ 3 lines.", "sfx": "Centre line whoosh · one ding per side"}, "bars": {"title": "Highlighter bars", "use": "Two parallel points, like a highlighter swipe (selling points, results).", "avoid": "Keep bar text to 2–5 characters; more than 2 bars steals focus from the face.", "sfx": "One ding or cash-register per bar (`cash`, `gold`)"}, "vertical-wall": {"title": "Right-wall vertical text", "use": "A 2–4 character key word stacked on the right edge. Keeps the face clear — good for emotion/conclusion words.", "avoid": "More than 4 characters; if the face sits on the right, mirror it to the left wall.", "sfx": "One hit per character, heaviest on the last"}, "dark-question": {"title": "Dim + big question", "use": "Low voice, rhetorical question, suspense. Edges darken, only one question stays, the camera creeps in.", "avoid": "Max 1–2 per video, or it loses weight.", "sfx": "A puzzled sound (`huh`) — or total silence"}, "chapter": {"title": "Chapter list 01/02", "use": "Explaining a method or steps: big number + title + ticked cards, with the picture lifted so text sits on the chest.", "avoid": "One number at a time; ≤ 2 cards.", "sfx": "Number = thud · each card = ding"}, "giant-fill": {"title": "Giant-character fill", "use": "The punchline: one huge hollow character above the head fills from the bottom as you say the key line.", "avoid": "One character only; at most once per video — save it for the last line.", "sfx": "Outline appears = whoosh · fill = impact (`filmdong`)"}, "typed-quote": {"title": "Round window + typed quote", "use": "A quote/golden line: black background, a round portrait window on top, your words typed out character by character below.", "avoid": "Each line ≤ 9 characters; each character must appear when you actually say it.", "sfx": "Typing sound (one per character)"}, "signature": {"title": "Signature card", "use": "Outro: name + one-line persona + series name. Dimmed base, no heavy SFX, a clean ending.", "avoid": "No more than 3 lines; no new information.", "sfx": "None (or one very soft ding)"}, "split-retention": {"title": "Card over face · retention curve", "use": "Hook / talking about \"nobody watches to the end\": a curve card draws on top, your portrait window below. Give viewers a visual hook in the first 3 seconds — not just captions.", "avoid": "Don't put paragraphs in the card — one graphic plus one word; max 2 per video.", "sfx": "Whoosh → tech-reveal → sigh (on the \"swipe away\" beat)"}, "split-compare": {"title": "Card over face · compare timelines", "use": "\"Messy vs tidy\", \"beginner vs pro\": two small graphics side by side (✗ / ✓) on top, you talking below.", "avoid": "The two sides must look clearly different (messy vs tidy) or the contrast is lost.", "sfx": "Whoosh → puzzled (messy) → correct (tidy)"}, "phone-swipe": {"title": "Phone swipe-away", "use": "Talking about viewers swiping away: your video plays inside a phone on black, three lines on the right build up, and on the key line the phone flicks upward.", "avoid": "Max three lines of ≤ 6 characters (only ~360px of width on the right); don't chain it right after left-stair.", "sfx": "Bubble → click → suspense (`sus`) → swish (the swipe)"}, "reporter": {"title": "Reporter stand-up (cut-out in front)", "use": "Steps/lists: black background, a chapter card on top, you cut out and standing in front. Needs per-frame matting (macOS: Apple Vision).", "avoid": "Don't use it without matting (the preview shows a stand-in); one number per card.", "sfx": "Pop-up → bowl ding → prompt → correct"}, "pip-broll": {"title": "Full-screen B-roll + PIP face", "use": "When you name a concrete thing (product, place, animal…): B-roll fills the screen and you shrink to a white-ringed round window. Rotate the window top-right / top-left / bottom-centre; don't cover the subject.", "avoid": "B-roll with no clear subject looks empty; keep the window off the label tag; don't reuse the same corner 3 times.", "sfx": "Whoosh (B-roll in) → bubble (window pops)"}, "split-broll": {"title": "Face on top, B-roll below (split screen)", "use": "Talk while showing something: you on top (face stays put), a B-roll strip below, named with a yellow label tag.", "avoid": "No captions on the strip (captions stay on you, y ≤ 1230); give static images a slow push.", "sfx": "Swish (strip rises) → prompt (label tag)"}, "broll-bottom": {"title": "Bottom slide-in B-roll strip", "use": "You stay full-screen; B-roll slides up over the lower ~45%. The lightest way to insert B-roll — good for a noun that flashes by.", "avoid": "The strip covers the chest band, so captions must move out of the way (above the strip, or hidden for the moment).", "sfx": "Whoosh (slide in) → nothing (keep the sound clean)"}, "poster-hero": {"title": "Poster hero word + dim", "use": "A key noun / pain word: a full-screen poster or AI image dimmed 40% and one gold (benefit) or red (pain) word slams in, then slowly grows across the shot.", "avoid": "Only the 2–3 most important words per video; keep it ≤ 4 characters or the type gets too small.", "sfx": "Stamp (`stamp`/`peng`) → cinematic impact when it reaches full size"}, "label-hero": {"title": "Label + hero overlap", "use": "A small label stacked onto a big word (like \"GMV\" pressed onto \"20M\") so a number or key term reads at a glance; optionally add a white-box red-text mini tag.", "avoid": "Don't use the same colour for label and hero; keep the hero ≤ 4 characters or it shrinks too much.", "sfx": "Ding → stamp / impact"}, "spread-hero": {"title": "Wide-tracked hero word", "use": "A 1–3 character hero word with tracking stretched across the full width, like a poster headline (\"DON'T / GAMBLE\"). Top line yellow, bottom line white or red.", "avoid": "More than 3 characters falls apart when spread; use only for the harshest line, 1–2 times per video.", "sfx": "Impact / punch / heavy hit"}, "ghost-word": {"title": "Ghost word (giant translucent glyph)", "use": "A giant translucent word as background (\"烦\", \"WHY\", \"100%\") with a small line on top that names the topic.", "avoid": "Don't put it over the face (this library keeps it in the chest band); no more than 3 glyphs or it turns to mush.", "sfx": "Whoosh → thud"}, "quote-card": {"title": "Quote card (dimmed + blurred)", "use": "Background dims and blurs; a numbered white-box tag plus the quoted line with the key words in yellow; a small right-aligned source line. For data, quotes and findings.", "avoid": "Max 2 quotes of ≤ 2 lines each; keep the source short; don't use it for subjective claims that have no source.", "sfx": "Prompt tone / typing"}, "chapter-tag": {"title": "Chapter tag", "use": "A yellow rounded block (italic number) + arrow + dashed-outline title — marks \"point 1\", lighter than a giant number.", "avoid": "One number at a time; pick either this or the Chapter list, don't stack them.", "sfx": "Ding / prompt tone"}, "motion-fade": {"title": "Fade in", "use": "The workhorse base: knowledge, narration, ordinary lines; never steals focus (110 uses in the source pack — #1).", "avoid": "Don't use it when you need emphasis; don't use it on every line.", "sfx": "Paper rustle / soft whoosh, or none"}, "motion-slide-up": {"title": "Slide up", "use": "Gentle entrances: titles, list items one by one — a small upward drift plus fade.", "avoid": "Many lines in the same direction look stiff.", "sfx": "Soft whoosh / swish"}, "motion-reveal-up": {"title": "Reveal upward", "use": "Wipes on from the bottom upward: definitions and conclusions, a little ceremony.", "avoid": "Small text hides the wipe.", "sfx": "Swish"}, "motion-curtain": {"title": "Curtain open", "use": "Opens from the centre outward: opening titles, chapter names; a knowledge / classical feel.", "avoid": "Drags in fast sequences.", "sfx": "Paper rustle / whoosh"}, "motion-grow": {"title": "Grow", "use": "Numbers and key points: scale up from half size, a \"growing in\" feel.", "avoid": "Don't combine with Slam in the same line.", "sfx": "Click / ding / spring"}, "motion-grow-soft": {"title": "Soft grow", "use": "Subtle motion for caption-level emphasis (a 6% scale).", "avoid": "Too weak when you need impact.", "sfx": "Soft ding"}, "motion-shrink": {"title": "Shrink in", "use": "Emphasis and reversals: starts slightly large and settles — a \"dropping in\" feel (80 uses — #2).", "avoid": "Not for long sentences (the scaling pushes them out of bounds).", "sfx": "Thud / impact / water drop"}, "motion-slam": {"title": "Slam", "use": "The single heaviest word: lands from 3× size to 1× — must have a heavy hit.", "avoid": "Max 2–3 per video; without a heavy SFX it feels hollow.", "sfx": "Boom / cinematic thud"}, "motion-glow-blur": {"title": "Glow blur", "use": "Emotional, mystical, soft lines: blurred → sharp with a little bloom (106 uses across three variants).", "avoid": "Too slow (0.7 s) for fast-paced words.", "sfx": "Water drop / bell / magic"}, "motion-blur-left": {"title": "Blur-slide left", "use": "Topic changes and transition-feel lines: slides in from the right with motion blur.", "avoid": "Not for text sitting on the right side.", "sfx": "Whoosh / swish"}, "motion-rise-random": {"title": "Random rise", "use": "Knowledge / book-type lines: each character floats up from a different height.", "avoid": "Gets messy beyond ~8 characters.", "sfx": "Paper rustle"}, "motion-wave-bounce": {"title": "Wave bounce", "use": "Light, playful words: characters bounce in one after another like a wave.", "avoid": "Wrong tone for legal / financial / serious content.", "sfx": "Bubble / pop"}, "motion-typewriter": {"title": "Typewriter", "use": "Definitions, keywords, a \"typing\" feel; the safest pairing is a typing sound (68 uses).", "avoid": "Slow for long lines (0.075 s per character).", "sfx": "Typing sound (one per character)"}, "motion-develop": {"title": "Develop (char by char)", "use": "Calm, literary lines: each character develops from blurry grey to sharp.", "avoid": "Drags beyond ~0.7 s; keep ≤ 8 characters.", "sfx": "None, or water drop / airy"}, "motion-leap": {"title": "Leap in", "use": "Punchy short words: leaps up into place with a little overshoot.", "avoid": "Not for long sentences.", "sfx": "Ding / spring"}, "motion-roll-in": {"title": "Roll in", "use": "Numbers, money, deals: rolls up like a slot machine.", "avoid": "Long text is unreadable mid-roll.", "sfx": "Cash register / coin"}, "motion-tracking-in": {"title": "Tracking in", "use": "Titles and golden lines: characters gather from wide spacing into place — a \"focusing\" feel (52 uses across two variants).", "avoid": "The effect is hard to see with fewer than 3 characters.", "sfx": "Soft whoosh"}, "motion-echo": {"title": "Echo", "use": "Shouts, strong emotion, \"Attention!\": the word pops and sends echo rings outward.", "avoid": "Once or twice per video; not for long lines.", "sfx": "Heavy thud / impact"}, "theme-biz-gold-red": {"title": "Business gold & red", "use": "Law, finance, loans, property, education, business, cars, study-abroad — credible and crisp. Smiley Sans as the main font + gold #ffbf17 / deep red #b71c1c (52% of the industry clips). Entrances lean to fade / grow / shrink / glow-blur; SFX lean to whoosh and impact.", "avoid": "Gold = benefit and red = pain within a layout; don't add a third accent colour.", "sfx": "Whoosh → impact / whirl"}, "theme-guofeng-cream": {"title": "Classical cream", "use": "Wellness, women's emotion / growth, psychology, relationships, yoga, custom homes — gentle and refined. Serif fonts + cream #fff589 / deep red. Entrances lean to fade / grow-soft / curtain / develop; SFX lean to paper and whoosh.", "avoid": "The pack uses Classical / Jinling fonts (not bundled); this library falls back to Source Han Serif Heavy, so the refined feel is weaker.", "sfx": "Paper rustle → whoosh"}, "theme-knowledge-yellow": {"title": "Knowledge yellow", "use": "Paid knowledge, career, founder IP, business coaches, used cars, property agents, reading, tax — bright and practical. Douyin Meihao as the supporting font + bright yellow #fff589 / deep red. Entrances lean to shrink / fade / curtain / blur-left; SFX lean to swish, paper, typing.", "avoid": "The densest pacing (about 78 blocks/min and 54 SFX/min — medians for 15–60 s shorts); don't copy it to long videos.", "sfx": "Swish → typing"}, "emo-cry": {"title": "Cry (emotion loading)", "use": "One word carries a negative emotion: the text starts white and red fills it from the bottom like liquid (about 0.7 s), tracking stretched across the width. For words like \"breakdown\", \"pain\", \"crying\".", "avoid": "1–2 per video; not for long lines; red is the pain colour, so don't stack it on layouts that already use red as the accent.", "sfx": "Heavy thud / sigh"}, "emo-surprise": {"title": "Surprise (wave)", "use": "Surprise and sudden turns: two characters bob out of phase, each tilted about ±8°, looping about 1 s, in gold.", "avoid": "Gets messy with more characters (2–3 is best); wrong tone for serious content.", "sfx": "Surprise sound / pop"}, "emo-joy": {"title": "Joy (text glow)", "use": "Joy, good news, success: pale-yellow text with radiating light rays pulsing in beat behind it, about 1 s per cycle.", "avoid": "The rays wash over what is behind; don't use it together with large B-roll; 1–2 per video.", "sfx": "Ding / magic / cheer"}, "emo-shout": {"title": "Shout (megaphone)", "use": "Shouting, calling for help, \"Attention!\": two characters tilt outward, fade in, then sway gently while echoes ripple outward.", "avoid": "Short words of 2–3 characters only; the echo grows beyond the text, so leave room on both sides.", "sfx": "Heavy thud / impact"}, "glass-hero": {"title": "Glass text (translucent gradient)", "use": "One hero word as \"glass text\": a gold gradient, but the light/dark texture of the picture behind shows through it, like frosted glass. For opening titles, brand words, the one big word in a video.", "avoid": "The picture behind needs light/dark variation (wood grain, brick, curtains) — a flat dark wall barely shows the effect; it must not sit inside a wrapper with transform / opacity / filter (the blend stops working).", "sfx": "Whoosh → magic / sparkle"}, "text-behind": {"title": "Text behind the person (matte)", "use": "Big text placed behind the person: background → text → matte PNG on top, so the person covers part of the text and the frame gains depth. Needs per-frame matting (macOS: Apple Vision).", "avoid": "Don't use it without a matte; put the text inside the same camera container as the video (so it follows hand-shake / push-ins); a frame without a matte draws no text — better no text than text across the face; keep the window to ~3 s (per-frame matting is slow).", "sfx": "Thud / impact"}, "glass-behind": {"title": "Glass text behind the person", "use": "Both together: a gold glass word behind the person, texture showing through, the person covering part of it. The most premium-looking big text.", "avoid": "The limits of Glass text and Text behind combined; at most once per video — save it for the opening or the one key line.", "sfx": "Whoosh → thud / magic"}, "top-title": {"title": "Persistent top title", "use": "A two-line series name pinned to the top for the whole video (white + accent colour): someone who scrolls in late still knows the topic. Appears at the start and stays until just before the end.", "avoid": "Only when there is room above the head; a big face (head top ≈ y230) covers it, so lower the picture or make headroom first. Keep it under 8 characters, not a sentence.", "sfx": "None (background information, it doesn't sound)"}, "stack-list": {"title": "Stacking list (older lines dim)", "use": "For 2–3 points: lines appear one by one, the older ones dim when a new one lands, and a closing line drops on top as a big word.", "avoid": "More than 3 lines (with the closing word) or 4 (without) overflows the chest band; keep each line ≤ 8 characters.", "sfx": "A ding per line, a heavy hit on the closing word"}, "end-cta": {"title": "Ending action (pill + arrow)", "use": "The ending tells them where to tap next: a blue pill button + an arrow pointing to the bottom-left. Almost every industry video ends this way.", "avoid": "The wording comes from the user; if there is no account / contact, don't invent one. Don't stack it with the signature card (pick one, or pill above and signature below).", "sfx": "One very light ding, no heavy sound effect"}, "camera-punch": {"title": "Opening punch-in", "use": "The first second of the video: the picture punches from 1.28× to 1.0× with a bounce and motion blur. The first beat of the hook, paired with a whoosh.", "avoid": "Once per video, at the start; keep the face centred and high, or the punch pushes it out of frame.", "sfx": "Whoosh up (whoosh_up)"}, "camera-shake": {"title": "Impact shake", "use": "On the beat a key word slams down, the picture shakes and pops to 1.06×. Only the picture shakes, not the text.", "avoid": "At most 4–6 per video, each on a real hit; never back to back.", "sfx": "Hit / boom"}, "camera-tvoff": {"title": "TV switch-off", "use": "For \"the ads stop, the business stops\" / \"it all disappeared\": the picture squashes to a line, then a dot, then black, held until the next sentence.", "avoid": "Always give `until`, or the black runs to the end; only for \"gone / over\" sentences.", "sfx": "Sub drop"}, "camera-send": {"title": "Shrink into a phone and fly away", "use": "For \"send this video to him\" / \"share\": the whole picture shrinks into a phone, pauses, then flies to the top right.", "avoid": "Use the dark starfield behind it, not white; at most once, for the share call to action.", "sfx": "Whoosh up + zip up"}, "camera-circle": {"title": "Picture becomes a circle + circles around", "use": "For \"the peers around you / your team / your customers\": the speaker shrinks to a circular avatar and circles pop out around him, joined by lines. The textbook \"draw what you say\".", "avoid": "Tell it where the face is (`face`); at most 6 circles; don't combine with captions and big text at once.", "sfx": "Pop × N"}, "white-flash": {"title": "White flash", "use": "On the hook beat, a scene change or an impact: the whole screen flashes white for 0.22 s. Often on the same frame as the punch-in and a big word.", "avoid": "At most 3–4 per video; not on quiet sentences.", "sfx": "Flash"}, "kinetic-line": {"title": "Word-by-word pop", "use": "One word per beat: the new word pops in big, the previous one shrinks and dims above it; the hot word is accent-coloured and bigger. Good for the opening punchline.", "avoid": "≤ 6 words a line; each word timed to when it is spoken; don't squeeze it into the chest band together with captions.", "sfx": "Pop / hit on the hot word"}, "counter-slam": {"title": "Number counts up and slams", "use": "For concrete numbers (8 deals, 500k, 10 years): it counts from 0, slows down, then lands with a slam and a glow — far stronger than just showing the number.", "avoid": "1–3 numbers per video; the number must be what he actually said; put the unit in the suffix.", "sfx": "Tick + hit"}, "stamp": {"title": "Stamp text", "use": "For \"all of them were X\" / \"closed\" / \"key point\": the text is stamped down from 2.2× to 1× with a slight tilt.", "avoid": "≤ 6 characters; red / accent, not the same colour as the big text; 1–2 per video.", "sfx": "Stamp"}, "chat-dm": {"title": "Chat box send", "use": "For \"DM me X\" / \"comment X\": an input box slides up, types, sends, and an accent bubble flies up. Makes the call to action visible.", "avoid": "Use the keyword he actually says (≤ 6 characters); put it at the end; don't also stack the ending pill.", "sfx": "Typing + pop + notify"}, "slot-row": {"title": "Empty slots pop in", "use": "For \"at least 7 deals\" / \"ten places\" / \"the goal\": N dashed slots pop in one by one underneath.", "avoid": "N ≤ 10; keep it in the chest band (y≈1050); don't cover captions.", "sfx": "Pop × N"}, "rapid-montage": {"title": "Screenshot flash", "use": "Real screenshots as evidence: each one punches in for 0.2 s with a slight tilt, the last one holds, \"No. N\" on top. A real screenshot beats any animation.", "avoid": "Supply the screenshots yourself (under public, with their pixel sizes); blank out other people's names and phone numbers; at most 12.", "sfx": "Camera shutter"}, "jy-text-a": {"title": "JianYing text animations A (4)", "use": "4 of the 24 JianYing presets: reveal up / random rise / blur glow / shout wave. Each preset's offset / scale / brightness / blur is written as a per-frame table measured from the JianYing sample; sound effects are paired automatically.", "avoid": "Not every word needs to move (52% of the original pack's text has no animation); one preset per sentence, never the same one twice in a row.", "sfx": "Per preset (see autosfx)"}, "jy-text-b": {"title": "JianYing text animations B (4)", "use": "Shrink II (big first, then slam) / wave bounce / typewriter / leap. The \"bounce\" presets overshoot and pair with variety-show sounds; the rest are basically ease-out.", "avoid": "Bounce only for light words; typewriter only for definitions / keywords; don't make everything bounce.", "sfx": "Per preset (see autosfx)"}, "backdrop-cosmos": {"title": "Starfield backdrop page", "use": "The layer revealed when the person shrinks to an avatar or a phone: a dark starfield with three parallax layers and a slowly turning nine-grid; colours come from the theme. No images needed.", "avoid": "Don't use it as the whole-video background (it competes with the person); only for \"black page\" scenes.", "sfx": "None"}, "particles": {"title": "Gold dust / fireflies", "use": "An ambient layer over the picture: gold = dust drifting up, firefly = warm fireflies that blink. Gives a traditional / story feel some air.", "avoid": "Keep it sparse (n ≤ 60); not for fast-paced videos, it looks dirty.", "sfx": "None"}, "ink-wipe": {"title": "Ink-wash transition", "use": "A transition between two segments: a blob of ink spreads from the centre to cover the screen, then recedes (blot / brush sweep / splash / rise). Traditional / story feel.", "avoid": "At most 3 per video; 0.9 s long, don't put it over a key word.", "sfx": "Long whoosh"}, "title-tag": {"title": "Title + tag + caption", "use": "Series-style opening: a title fades in at the top, an orange tag expands beside it (\"Part 2\", \"Ep. 3\"), plus a small caption line.", "avoid": "Title ≤ 8 characters, tag ≤ 4; use `y` to keep it off the face.", "sfx": "Swish + pop"}, "pixel-text": {"title": "Pixel text (dot-matrix)", "use": "For AI / code / data / tech lines: the picture dims, the word types out in a dot-matrix, each new letter with a red/cyan split, then a small subtitle.", "avoid": "≤ 6 characters; once per video; the dimmed picture means it may sit over the body but keep it off the face.", "sfx": "Typing ticks"}, "drop-text": {"title": "Drop text", "use": "For \"fell / collapsed / crashed\": big letters drop one by one with gravity, rotate and bounce, ending in a small pile.", "avoid": "≤ 4 characters; once per video.", "sfx": "Thud × N"}, "huge-caption": {"title": "Huge word + small tag", "use": "One huge word with a small accent-colour word popping at its lower right (e.g. \"Top / seller\").", "avoid": "Big word ≤ 3 characters, small word ≤ 3; centred, use `y`.", "sfx": "Punch + pop"}, "title-card": {"title": "Full-screen title card", "use": "Chapter turn: a colour card slides up over the picture, two or three big lines appear in turn, then it slides away.", "avoid": "At most 2 per video; ≤ 8 characters a line; change the colour with `color`.", "sfx": "Whoosh + ding"}, "prompt-box": {"title": "Prompt box", "use": "For \"one instruction does it\": a pill input box grows from its send button, the instruction types out, the send button lights up.", "avoid": "≤ 10 characters; place below the chin (use `y`).", "sfx": "Typing + pop"}, "glass-chart": {"title": "Glass chart", "use": "For \"views / growth\": a frosted-glass card, the big number eases up to the target while a green line draws left to right.", "avoid": "Numbers must be what the speaker really said; 1–2 per video.", "sfx": "Ticks + ding"}, "compare-tiles": {"title": "Before / after tiles", "use": "For \"was 180 min, now 3 min\": two tiles, one fixed, one counts to the target, turns accent and shows the verdict line.", "avoid": "Numbers must be real; verdict ≤ 10 characters.", "sfx": "Ticks + success"}, "photo-cards": {"title": "Photo cards", "use": "For \"material / cases / screenshots\": white-bordered cards fly in from the edges, overshoot and settle.", "avoid": "Put images in `srcs`; without them colour blocks are drawn.", "sfx": "Camera × N"}, "side-sticker": {"title": "Side sticker", "use": "For a result number: a small card flies beside the head, then a white number sticker with a red tag pops up.", "avoid": "Sticker text ≤ 5 characters.", "sfx": "Pop + thud"}, "particle-fill": {"title": "Particles fill a container", "use": "For \"accumulating bit by bit\": a cream panel slides down, orange particles fall into a U-shaped container and pile up.", "avoid": "Title ≤ 8 characters; the panel covers the top part of the picture.", "sfx": "Ticks"}, "side-doc": {"title": "Document + step highlight", "use": "For \"process / steps\": a white document card slides in from the left and a highlight bar steps down the list.", "avoid": "≤ 4 steps, ≤ 8 characters each; push the person right with `reframe`/`zoom`.", "sfx": "Tick per step"}, "thumb-wall": {"title": "Collection wall", "use": "For \"a collection of N\": dark background, big title + pill, a thumbnail grid fills in column by column.", "avoid": "Thumbnails via `srcs`.", "sfx": "Pop × N"}, "comment-card": {"title": "Comment CTA card", "use": "Ending: dark background, \"Comment X\" title fades in and an orange pill pops up.", "avoid": "Only at the end; keyword ≤ 4 characters.", "sfx": "Ding"}, "timeline-panel": {"title": "Timeline panel", "use": "For \"auto-edit / piece by piece\": a dark panel slides in, the timecode ticks per frame, thumbnails fill in, waveforms and a red playhead sweep across.", "avoid": "Once per video; place below the chin (`y`), keep it off the face.", "sfx": "Ticks + swish"}, "drop-zone": {"title": "Drop in footage", "use": "For \"drop your footage in\": a dashed card, a thumbnail flies in along an arc, the text turns to \"imported\" and a yellow check appears.", "avoid": "Write the label from what he really says; once per video.", "sfx": "Whoosh + pop"}, "palette": {"title": "Colour picker palette", "use": "For \"colour / grade / style\": a cream card slides up, an eyedropper lands on points in the picture, swatches fill with colour and hex code.", "avoid": "Land x, y where the picture really has that colour; ≤3 swatches.", "sfx": "Pop × N"}, "before-after": {"title": "Before / after slider", "use": "For \"before and after the grade\": the picture goes grey, a white line with a handle sweeps left to right, warm graded picture on the right.", "avoid": "Only changes colour, never the person; once per video.", "sfx": "Whoosh + ding"}, "app-icons": {"title": "App icon row", "use": "For \"which tools\": rounded icons pop in one by one with small names; optionally remove one.", "avoid": "Fill in your own names and colours, no brand logos; ≤5.", "sfx": "Pop × N"}, "camera-glitch": {"title": "Glitch", "use": "For \"glitch / error / broken\": 2–3 frame bursts: the picture splits into horizontal bands, shifts sideways, red/cyan channels separate, scanlines, then snaps back clean. Irregular bursts; the last on the key word.", "avoid": "Bursts are only 2–3 frames, never continuous; 1–2 per video.", "sfx": "Flash"}, "camera-droste": {"title": "Infinite picture-in-picture", "use": "For \"infinite / loop / nested\": a picture frame appears above, showing the same video, which contains another frame (3 levels); finally the camera pushes into the frame.", "avoid": "Put the frame above the head, off the face; once per video.", "sfx": "Pop + whoosh"}, "camera-handmark": {"title": "Hand-drawn circle mark", "use": "For \"look here / this expression\": the picture goes grey, an orange hand-drawn ellipse circles the face in one stroke, inside stays in colour, a handwritten label types out bottom-left.", "avoid": "Aim the ellipse at the face (measure with face_track.py); label ≤6 characters.", "sfx": "Whoosh + pop"}, "camera-shape": {"title": "Shape reveal (circle window + ripples)", "use": "For \"focus / zoom in / the point\": cream background, the speaker shrinks into a circle with an orange ring and   $('#sfx-title').textContent = u.title; $('#sfx-lede').textContent = f(u.lede); $('#sfx-f1').innerHTML = f(u.fact1); $('#sfx-f2').innerHTML = f(u.fact2);
  $('#sfx-q').placeholder = u.search; $('#th-a').textContent = u.colAnim; $('#th-n').textContent = u.colN; $('#th-s').textContent = u.colSfx; $('#th-i').textContent = u.colId; $('#sfx-note').textContent = u.note;
  const rows = STYLE.sfx_pairs.filter((r) => !sfxQ || (r.anim + ' ' + r.sfx.map((x) => x.name + ' ' + (x.id || '')).join(' ')).toLowerCase().includes(sfxQ.toLowerCase()));
  $('#sfx-body').innerHTML = rows.map((r) => `<tr><td>${esc(r.anim)}</td><td>${r.n}</td><td>${r.sfx.slice(0, 3).map((x) => esc(x.name) + ' ×' + x.n).join('<br>')}</td><td>${r.sfx.slice(0, 3).map((x) => (x.id ? '<code>' + esc(x.id) + '</code>' : '—')).join('<br>')}</td></tr>`).join('');
}
$('#sfx-q').addEventListener('input', (e) => { sfxQ = e.target.value.trim(); applySfx(); });
function match(d) {
  if (filter !== 'all' && kindOf(d) !== filter) return false;
  if (!query) return true;
  const e = I18N.entries[d.id] || {};
  const hay = [d.zh, d.id, d.use, d.avoid, d.sfx, d.no, e.title, e.use, e.avoid, e.sfx].join(' ').toLowerCase();
  return query.toLowerCase().split(/\s+/).every((w) => hay.includes(w));
}
function render() {
  list = DATA.filter(match);
  $('#count').textContent = U().count.replace('{n}', list.length).replace('{m}', DATA.length);
  $('#empty').hidden = list.length > 0;
  $('#grid').innerHTML = list.map((d, i) => `
    <button class="card" data-i="${i}" aria-label="${tx(d, 'zh')}">
      <div class="thumb">
        <span class="badge ${kindOf(d)}">${badge(d)}</span>
        <img src="previews/${d.id}.jpg" alt="" loading="lazy">
        <video muted loop playsinline preload="none" data-src="previews/${d.id}.mp4"></video>
      </div>
      <div class="meta"><h3>${tx(d, 'zh')}</h3><code>${d.id}</code><p>${tx(d, 'use')}</p></div>
    </button>`).join('');
}
// 悬停 / 聚焦才加载并播放（省流量）；触屏点开后在弹窗里播
document.addEventListener('pointerenter', (e) => {
  const c = e.target.closest && e.target.closest('.card'); if (!c) return;
  const v = c.querySelector('video'); if (!v.src) v.src = v.dataset.src; v.play().catch(() => {});
}, true);
document.addEventListener('pointerleave', (e) => {
  const c = e.target.closest && e.target.closest('.card'); if (!c) return;
  const v = c.querySelector('video'); v.pause(); v.currentTime = 0;
}, true);

function fill(d) {
  $('#mid').textContent = (kindOf(d) === 'layout' ? U().idPre + d.no : badge(d)) + ' · ' + d.id;
  $('#mt').textContent = tx(d, 'zh'); $('#muse').textContent = tx(d, 'use'); $('#mavoid').textContent = tx(d, 'avoid'); $('#msfx').textContent = tx(d, 'sfx');
  $('#mcode').textContent = d.beat || d.snippet; $('#h-code').textContent = d.beat ? U().codeBeat : U().codeH;
}
function open(i) {
  cur = i; const d = list[i]; if (!d) return;
  fill(d);
  const dlg = $('#dlg'); if (!dlg.open) dlg.showModal();
  const v = $('#mv'); v.pause(); v.src = 'previews/' + d.id + '.mp4'; v.load();
  v.oncanplay = () => { v.oncanplay = null; v.play().catch(() => {}); };   // 换源后等数据就绪再播；不要设 currentTime（会让部分浏览器停播）
  $('#prev').disabled = i <= 0; $('#next').disabled = i >= list.length - 1;
}
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1600); }
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); toast(msg); }
  catch { const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast(msg); } catch { toast(lang === 'zh' ? '复制失败，请手动选中' : 'Copy failed — select manually'); } ta.remove(); }
}
function promptFor(d) {
  const u = U();
  return u.prompt.replace('{zh}', tx(d, 'zh')).replace('{kind}', u.kinds[kindOf(d)]).replace('{id}', d.id).replace('{use}', tx(d, 'use')).replace('{avoid}', tx(d, 'avoid')).replace('{sfx}', tx(d, 'sfx'));
}
$('#grid').addEventListener('click', (e) => { const c = e.target.closest('.card'); if (c) open(+c.dataset.i); });
$('#x').addEventListener('click', () => $('#dlg').close());
$('#dlg').addEventListener('click', (e) => { if (e.target === $('#dlg')) $('#dlg').close(); });
$('#dlg').addEventListener('close', () => $('#mv').pause());
$('#prev').addEventListener('click', () => open(cur - 1));
$('#next').addEventListener('click', () => open(cur + 1));
$('#cp-prompt').addEventListener('click', () => copy(promptFor(list[cur]), U().toastPrompt));
$('#cp-code').addEventListener('click', () => copy(list[cur].beat || list[cur].snippet, U().toastCode));
$('#lang').addEventListener('click', () => {
  lang = lang === 'zh' ? 'en' : 'zh'; try { localStorage.setItem('vc-lang', lang); } catch (e) {}
  applyUI(); render(); if ($('#dlg').open && list[cur]) fill(list[cur]);
});
document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); }
  if ($('#dlg').open) { if (e.key === 'ArrowLeft' && cur > 0) open(cur - 1); if (e.key === 'ArrowRight' && cur < list.length - 1) open(cur + 1); }
});
$('#q').addEventListener('input', (e) => { query = e.target.value.trim(); render(); });
document.querySelectorAll('.chip[data-f]').forEach((b) => b.addEventListener('click', () => {
  filter = b.dataset.f; document.querySelectorAll('.chip[data-f]').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); render();
}));
applyUI(); render();
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>video-craft</title>
<meta name="description" content="口播剪出网感：文字版式 + 换场，每款都有预览、用法和代码。">
<style>
:root{
  --bg:#0B0912; --panel:#14111f; --panel2:#1b1729; --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --text:#ECE9F5; --muted:#9A93B5; --accent:#95D024; --accent-ink:#10140A; --purple:#8255FA; --soft:#B9A2FF; --warn:#FFBF17;
  --r:18px;
}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--text);font:16px/1.6 "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--soft)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header.top{padding:56px 0 28px;background:radial-gradient(ellipse 60% 120% at 20% 0%,rgba(130,85,250,.22),transparent 70%)}
.eyebrow{font:600 13px/1 ui-monospace,Menlo,monospace;color:var(--accent);letter-spacing:.08em;margin-bottom:14px}
h1{font-size:clamp(30px,5vw,48px);line-height:1.15;font-weight:800;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--accent)}
.lede{color:var(--muted);max-width:640px;margin-top:14px;font-size:17px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:28px}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search input{width:100%;height:46px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--text);padding:0 70px 0 18px;font:inherit;font-size:15px}
.search input:focus{outline:2px solid var(--purple);outline-offset:2px}
.search kbd{position:absolute;right:14px;top:50%;transform:translateY(-50%);font:12px ui-monospace,Menlo,monospace;color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:transparent;color:var(--muted);font:inherit;font-size:14px;cursor:pointer}
.chip:hover{color:var(--text);border-color:var(--soft)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.safe{margin:22px 0 0;padding:14px 18px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:12px;background:var(--panel);color:var(--muted);font-size:14px}
.safe b{color:var(--text)}
main{padding:28px 0 72px}
.count{color:var(--muted);font-size:14px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;color:inherit;font:inherit;padding:0;display:flex;flex-direction:column;transition:transform .18s,border-color .18s}
.card:hover,.card:focus-visible{transform:translateY(-3px);border-color:var(--soft)}
.card:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.thumb{position:relative;aspect-ratio:9/16;background:#0d0b16;overflow:hidden}
.thumb video,.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.badge{position:absolute;left:10px;top:10px;z-index:2;font:700 12px/1 ui-monospace,Menlo,monospace;padding:6px 9px;border-radius:999px;background:rgba(11,9,18,.78);border:1px solid var(--line2);color:var(--accent);backdrop-filter:blur(6px)}
.badge.scene{color:var(--soft)}
.badge.mo{color:var(--warn)}
.badge.th{color:#ff8fb1}
.badge.em{color:#ff6b6b}
.badge.mx{color:#7fe0ff}
.meta{padding:13px 14px 15px}
.meta h3{font-size:16px;line-height:1.35;font-weight:700}
.meta code{display:block;margin-top:3px;font:12px ui-monospace,Menlo,monospace;color:var(--muted)}
.meta p{margin-top:8px;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
/* modal */
dialog{border:0;padding:0;background:transparent;color:inherit;max-width:none;max-height:none;width:100%;height:100%}
dialog::backdrop{background:rgba(5,4,10,.82);backdrop-filter:blur(6px)}
.sheet{position:relative;max-width:980px;margin:min(5vh,36px) auto;background:var(--panel);border:1px solid var(--line2);border-radius:24px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);overflow:hidden;max-height:calc(100vh - 2*min(5vh,36px));overflow-y:auto}
.sheet .vid{background:#0d0b16;display:flex;align-items:center;justify-content:center}
.sheet video{width:100%;aspect-ratio:9/16;object-fit:cover;display:block}
.body{padding:28px 28px 30px;display:flex;flex-direction:column;gap:18px;min-width:0}
.body h2{font-size:26px;line-height:1.25}
.body .id{font:13px ui-monospace,Menlo,monospace;color:var(--accent)}
.sec h4{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-bottom:6px}
.sec p{font-size:15px}
.sec.avoid h4{color:var(--warn)}
pre{background:#0d0b16;border:1px solid var(--line);border-radius:12px;padding:14px;font:12.5px/1.55 ui-monospace,Menlo,monospace;color:#d8d3ea;overflow:auto;max-height:220px;white-space:pre}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:2px}
.btn{height:42px;padding:0 18px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.close{position:absolute;right:14px;top:14px;z-index:5;width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:rgba(11,9,18,.8);color:var(--text);font-size:20px;cursor:pointer}
.nav{display:flex;gap:8px;margin-left:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font-weight:700;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.toast.on{opacity:1}
.sfxsec{margin-top:64px;padding-top:36px;border-top:1px solid var(--line)}
.sfxsec h2{font-size:26px}
.sfxsec .lede{margin:8px 0 14px;max-width:760px}
.sfxsec .facts{display:grid;gap:8px;margin:14px 0 18px}
.sfxsec .facts p{padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--muted);font-size:14.5px}
.sfxsec .facts b{color:var(--accent)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table.sfx{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
table.sfx th,table.sfx td{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.sfx th{color:var(--muted);font-weight:600;font-size:12px;letter-spacing:.06em;background:var(--panel)}
table.sfx td code{font:12.5px ui-monospace,Menlo,monospace;color:var(--accent)}
table.sfx tr:last-child td{border-bottom:0}
.sfxsec .note{margin-top:10px;font-size:13px;color:var(--muted)}
.sfxsec .search{max-width:420px;margin-bottom:12px}
footer{border-top:1px solid var(--line);padding:30px 0 56px;color:var(--muted);font-size:14px}
footer ul{margin:10px 0 0 18px}
@media (max-width:760px){
  .sheet{grid-template-columns:1fr;margin:0;border-radius:0;max-height:100vh;height:100%}
  .sheet video{max-height:46vh;aspect-ratio:auto;object-fit:contain}
  .body{padding:20px 18px 28px}
  .grid{grid-template-columns:repeat(2,1fr);gap:12px}
}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="eyebrow">VIDEO-CRAFT · SKILL LIBRARY</div>
  <h1 id="h1"></h1>
  <p class="lede" id="lede"></p>
  <div class="tools">
    <label class="search"><span class="sr" style="position:absolute;left:-9999px">搜索</span><input id="q" type="search" placeholder="" autocomplete="off"><kbd>⌘ K</kbd></label>
    <div class="chips" role="group" aria-label="分类">
      <button class="chip" data-f="all" aria-pressed="true"></button>
      <button class="chip" data-f="layout" aria-pressed="false"></button>
      <button class="chip" data-f="scene" aria-pressed="false"></button>
      <button class="chip" data-f="jj" aria-pressed="false"></button>
      <button class="chip" data-f="mo" aria-pressed="false"></button>
      <button class="chip" data-f="th" aria-pressed="false"></button>
      <button class="chip" data-f="em" aria-pressed="false"></button>
      <button class="chip" data-f="mx" aria-pressed="false"></button>
      <button class="chip" data-f="sk" aria-pressed="false"></button>
    </div>
    <button class="chip" id="lang" aria-label="Language" style="margin-left:auto"></button>
  </div>
  <div class="safe" id="safe"></div>
</div></header>

<main><div class="wrap">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden></div>
  <section class="sfxsec" id="sfxsec">
    <h2 id="sfx-title"></h2><p class="lede" id="sfx-lede"></p>
    <div class="facts"><p id="sfx-f1"></p><p id="sfx-f2"></p></div>
    <label class="search"><input id="sfx-q" type="search" autocomplete="off"></label>
    <div class="tablewrap"><table class="sfx"><thead><tr><th id="th-a"></th><th id="th-n"></th><th id="th-s"></th><th id="th-i"></th></tr></thead><tbody id="sfx-body"></tbody></table></div>
    <p class="note" id="sfx-note"></p>
  </section>
</div></main>

<footer><div class="wrap"><b style="color:var(--text)" id="limh"></b><ul id="lim"></ul></div></footer>

<dialog id="dlg" aria-label="版式详情">
  <div class="sheet" id="sheet" role="document">
    <button class="close" id="x" aria-label="关闭">×</button>
    <div class="vid"><video id="mv" muted loop playsinline autoplay></video></div>
    <div class="body">
      <div><div class="id" id="mid"></div><h2 id="mt"></h2></div>
      <div class="sec"><h4 id="h-use"></h4><p id="muse"></p></div>
      <div class="sec avoid"><h4 id="h-avoid"></h4><p id="mavoid"></p></div>
      <div class="sec"><h4 id="h-sfx"></h4><p id="msfx"></p></div>
      <div class="sec"><h4 id="h-code"></h4><pre id="mcode"></pre></div>
      <div class="actions">
        <button class="btn primary" id="cp-prompt"></button>
        <button class="btn" id="cp-code"></button>
        <div class="nav"><button class="btn" id="prev" aria-label="上一个">←</button><button class="btn" id="next" aria-label="下一个">→</button></div>
      </div>
    </div>
  </div>
</dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const DATA = [{"id": "chest-big", "no": "#23", "zh": "胸口小字 + 大字", "use": "一句铺垫 + 一个要点词。最常用，每支口播至少 3 次。", "avoid": "连续 3 句都这样，会变成「全是重点＝没有重点」。", "sfx": "缩小 + 咚 / 撞击光", "snippet": "<ChestBig th={th} small=\"剪出网感的第一步\" big=\"删停顿\" at={0.4} until={3.4} />"}, {"id": "strike-swap", "no": "#24", "zh": "划掉换说法", "use": "纠正一个常见误区：旧说法被划掉，新说法砸出来。", "avoid": "旧说法太长——划线要一笔划完，字数 ≤6。", "sfx": "划线=纸张抖动 · 新词=咚", "snippet": "<StrikeSwap th={th} lead=\"很多人以为\" old=\"特效越多越好\" at={0.3} strikeAt={1.3} next=\"节奏\" nextAt={2.0} until={3.5} />"}, {"id": "left-stair", "no": "#53", "zh": "左齐阶梯", "use": "三步递进：原因 → 过程 → 结果。每行比上一行缩进，上一行变暗。", "avoid": "超过 3 行；每行字要短，关键词用大字。", "sfx": "每行一个「叮」，最后一行换重音", "snippet": "<LeftStair th={th} until={3.5} rows={[{ pre: '画面太', key: '平', at: 0.3 }, { pre: '字幕一直', key: '不变', at: 1.1 }, { pre: '观众', key: '划走了', at: 1.9, big: true }]} />"}, {"id": "a-to-b", "no": "#41", "zh": "A → B 因果", "use": "「越 A 越 B」「因为 A 所以 B」，用一个箭头把前后连起来。", "avoid": "A 和 B 各不超过 4 个字，否则箭头放不下。", "sfx": "A=轻 · 箭头=呼 · B=咚", "snippet": "<AtoB th={th} a=\"越乱\" b=\"越慢\" at={0.3} bAt={1.6} until={3.5} />"}, {"id": "two-column", "no": "#17", "zh": "两栏对比", "use": "两个方案 / 两种做法对照。中线先划下来，左右各出一组。", "avoid": "两边字数差太多会失衡；每栏 ≤ 3 行。", "sfx": "中线=嗖 · 左右各一个叮", "snippet": "<TwoColumn th={th} until={3.5} lineAt={0.3} left={{ pre: '新手一上来就', key: 'effect', tail: '加满', at: 0.5 }} right={{ pre: '高手先把', key: 'timing', tail: '对齐', at: 1.8 }} />"}, {"id": "bars", "no": "#9", "zh": "荧光条", "use": "两个并列要点，像荧光笔划过的重点（卖点、结果）。", "avoid": "条里只放 2–5 个字；超过 2 条会抢走人脸。", "sfx": "每条一个「叮」或收银机", "snippet": "<Bars th={th} until={3.5} lead=\"想要\" leadAt={0.3} bars={[{ text: '有节奏', at: 0.9 }, { text: '有重点', at: 1.8 }]} />"}, {"id": "vertical-wall", "no": "#35", "zh": "右墙竖排", "use": "2–4 个字的重点词竖着贴右边，不挡脸，适合「情绪词 / 结论词」。", "avoid": "超过 4 个字；脸在右边时要换左墙。", "sfx": "每个字一下重音", "snippet": "<VerticalWall th={th} until={3.5} chars={[{ c: '别', at: 0.5 }, { c: '再', at: 0.9 }, { c: '乱', at: 1.3, tone: 'accent2' }, { c: '剪', at: 1.7, tone: 'accent2' }]} />"}, {"id": "dark-question", "no": "#27", "zh": "压暗大问句", "use": "低声、反问、悬念。四周压暗，只留一个问句，镜头同时慢慢推近。", "avoid": "一支片最多 1–2 次，多了失去分量。", "sfx": "疑惑音，或完全静音", "snippet": "<DarkQuestion th={th} small=\"是不是我的素材\" big=\"不够好？\" at={0.3} bigAt={0.8} until={3.5} />"}, {"id": "chapter", "no": "—", "zh": "章节清单 01/02", "use": "讲方法、讲步骤：大数字 + 标题 + 打勾的小卡片，画面上移让字放在胸口。", "avoid": "一次只讲一个编号；卡片 ≤ 2 张。", "sfx": "数字=咚 · 每张卡片=叮", "snippet": "<Chapter th={th} until={3.5} num=\"01\" title=\"先定节奏\" at={0.3} chips={[{ text: '字块 ≤ 1.5 秒', at: 1.1 }, { text: '留 1 拍呼吸', at: 1.7 }]} punch={{ text: '两个都要做', at: 2.4 }} />"}, {"id": "giant-fill", "no": "#25", "zh": "巨字填满", "use": "落点金句：头顶一个巨大的空心字，讲到关键句从下往上填满。", "avoid": "只用 1 个字；全片最多 1 次，留给最后一句。", "sfx": "空心出现=呼 · 填满=综艺咚", "snippet": "<GiantFill th={th} char=\"稳\" at={0.3} fillAt={1.6} until={3.5} />"}, {"id": "typed-quote", "no": "#38", "zh": "圆窗逐字打出", "use": "金句 / 引用：黑底，上面圆形人像窗，下面一个字一个字打出你讲的话。", "avoid": "每行 ≤ 9 个字；字出现的时间要对上你讲那个字的时间。", "sfx": "打字声（每字一下）", "snippet": "<TypedQuote th={th} at={0.2} until={3.5} lines={[{ toks: toks('剪辑不是加特效', 0.5), size: 88 }, { toks: toks('是删掉多余的', 1.8, 0.12), size: 88 }, { toks: toks('废话', 2.7, 0.14), size: 170, tone: 'accent', pre: '「', post: '」' }]} />"}, {"id": "signature", "no": "—", "zh": "签名卡", "use": "片尾：名字 + 人设一句话 + 系列名。压暗底，不加重音效，留干净收尾。", "avoid": "别放多于 3 行；别再出新信息。", "sfx": "无（或一声很轻的叮）", "snippet": "<SignatureCard th={th} at={0.4} name=\"我是示例\" slogan={['不吹 AI，只讲', '真', 'AI']} tag=\"示例系列 · #1\" />"}, {"id": "split-retention", "no": "换场", "zh": "上卡下脸 · 留存曲线", "use": "钩子 / 讲「没人看完」：上面一张曲线卡画出来，下面是你的人像窗。开头 3 秒给观众一个「画面钩子」，不要只有字幕。", "avoid": "卡里别放整段字，只放一个图 + 一个词；整支最多 2 次。", "sfx": "嗖 → 高科技显示 → 无奈（划走那一下）", "snippet": "<SplitScene th={th} a={0.2} b={SU - 0.2} src={faceVideo}>{(tt) => <RetentionCard th={th} t={tt} title=\"总是没人看完？\" />}</SplitScene>"}, {"id": "split-compare", "no": "换场", "zh": "上卡下脸 · 对比时间轴", "use": "「乱 vs 齐」「新手 vs 高手」：上面左右两个小图对比（✗ / ✓），下面是你在讲。", "avoid": "左右两边视觉量要差得明显（乱 vs 齐），不然看不出对比。", "sfx": "嗖 → 疑惑（乱）→ 正 mall graphics side by side (✗ / ✓) on top, you talking below.", "avoid": "The two sides must look clearly different (messy vs tidy) or the contrast is lost.", "sfx": "Whoosh → puzzled (messy) → correct (tidy)"}, "phone-swipe": {"title": "Phone swipe-away", "use": "Talking about viewers swiping away: your video plays inside a phone on black, three lines on the right build up, and on the key line the phone flicks upward.", "avoid": "Max three lines of ≤ 6 characters (only ~360px of width on the right); don't chain it right after left-stair.", "sfx": "Bubble → click → suspense (`sus`) → swish (the swipe)"}, "reporter": {"title": "Reporter stand-up (cut-out in front)", "use": "Steps/lists: black background, a chapter card on top, you cut out and standing in front. Needs per-frame matting (macOS: Apple Vision).", "avoid": "Don't use it without matting (the preview shows a stand-in); one number per card.", "sfx": "Pop-up → bowl ding → prompt → correct"}, "pip-broll": {"title": "Full-screen B-roll + PIP face", "use": "When you name a concrete thing (product, place, animal…): B-roll fills the screen and you shrink to a white-ringed round window. Rotate the window top-right / top-left / bottom-centre; don't cover the subject.", "avoid": "B-roll with no clear subject looks empty; keep the window off the label tag; don't reuse the same corner 3 times.", "sfx": "Whoosh (B-roll in) → bubble (window pops)"}, "split-broll": {"title": "Face on top, B-roll below (split screen)", "use": "Talk while showing something: you on top (face stays put), a B-roll strip below, named with a yellow label tag.", "avoid": "No captions on the strip (captions stay on you, y ≤ 1230); give static images a slow push.", "sfx": "Swish (strip rises) → prompt (label tag)"}, "broll-bottom": {"title": "Bottom slide-in B-roll strip", "use": "You stay full-screen; B-roll slides up over the lower ~45%. The lightest way to insert B-roll — good for a noun that flashes by.", "avoid": "The strip covers the chest band, so captions must move out of the way (above the strip, or hidden for the moment).", "sfx": "Whoosh (slide in) → nothing (keep the sound clean)"}, "poster-hero": {"title": "Poster hero word + dim", "use": "A key noun / pain word: a full-screen poster or AI image dimmed 40% and one gold (benefit) or red (pain) word slams in, then slowly grows across the shot.", "avoid": "Only the 2–3 most important words per video; keep it ≤ 4 characters or the type gets too small.", "sfx": "Stamp (`stamp`/`peng`) → cinematic impact when it reaches full size"}, "label-hero": {"title": "Label + hero overlap", "use": "A small label stacked onto a big word (like \"GMV\" pressed onto \"20M\") so a number or key term reads at a glance; optionally add a white-box red-text mini tag.", "avoid": "Don't use the same colour for label and hero; keep the hero ≤ 4 characters or it shrinks too much.", "sfx": "Ding → stamp / impact"}, "spread-hero": {"title": "Wide-tracked hero word", "use": "A 1–3 character hero word with tracking stretched across the full width, like a poster headline (\"DON'T / GAMBLE\"). Top line yellow, bottom line white or red.", "avoid": "More than 3 characters falls apart when spread; use only for the harshest line, 1–2 times per video.", "sfx": "Impact / punch / heavy hit"}, "ghost-word": {"title": "Ghost word (giant translucent glyph)", "use": "A giant translucent word as background (\"烦\", \"WHY\", \"100%\") with a small line on top that names the topic.", "avoid": "Don't put it over the face (this library keeps it in the chest band); no more than 3 glyphs or it turns to mush.", "sfx": "Whoosh → thud"}, "quote-card": {"title": "Quote card (dimmed + blurred)", "use": "Background dims and blurs; a numbered white-box tag plus the quoted line with the key words in yellow; a small right-aligned source line. For data, quotes and findings.", "avoid": "Max 2 quotes of ≤ 2 lines each; keep the source short; don't use it for subjective claims that have no source.", "sfx": "Prompt tone / typing"}, "chapter-tag": {"title": "Chapter tag", "use": "A yellow rounded block (italic number) + arrow + dashed-outline title — marks \"point 1\", lighter than a giant number.", "avoid": "One number at a time; pick either this or the Chapter list, don't stack them.", "sfx": "Ding / prompt tone"}, "motion-fade": {"title": "Fade in", "use": "The workhorse base: knowledge, narration, ordinary lines; never steals focus (110 uses in the source pack — #1).", "avoid": "Don't use it when you need emphasis; don't use it on every line.", "sfx": "Paper rustle / soft whoosh, or none"}, "motion-slide-up": {"title": "Slide up", "use": "Gentle entrances: titles, list items one by one — a small upward drift plus fade.", "avoid": "Many lines in the same direction look stiff.", "sfx": "Soft whoosh / swish"}, "motion-reveal-up": {"title": "Reveal upward", "use": "Wipes on from the bottom upward: definitions and conclusions, a little ceremony.", "avoid": "Small text hides the wipe.", "sfx": "Swish"}, "motion-curtain": {"title": "Curtain open", "use": "Opens from the centre outward: opening titles, chapter names; a knowledge / classical feel.", "avoid": "Drags in fast sequences.", "sfx": "Paper rustle / whoosh"}, "motion-grow": {"title": "Grow", "use": "Numbers and key points: scale up from half size, a \"growing in\" feel.", "avoid": "Don't combine with Slam in the same line.", "sfx": "Click / ding / spring"}, "motion-grow-soft": {"title": "Soft grow", "use": "Subtle motion for caption-level emphasis (a 6% scale).", "avoid": "Too weak when you need impact.", "sfx": "Soft ding"}, "motion-shrink": {"title": "Shrink in", "use": "Emphasis and reversals: starts slightly large and settles — a \"dropping in\" feel (80 uses — #2).", "avoid": "Not for long sentences (the scaling pushes them out of bounds).", "sfx": "Thud / impact / water drop"}, "motion-slam": {"title": "Slam", "use": "The single heaviest word: lands from 3× size to 1× — must have a heavy hit.", "avoid": "Max 2–3 per video; without a heavy SFX it feels hollow.", "sfx": "Boom / cinematic thud"}, "motion-glow-blur": {"title": "Glow blur", "use": "Emotional, mystical, soft lines: blurred → sharp with a little bloom (106 uses across three variants).", "avoid": "Too slow (0.7 s) for fast-paced words.", "sfx": "Water drop / bell / magic"}, "motion-blur-left": {"title": "Blur-slide left", "use": "Topic changes and transition-feel lines: slides in from the right with motion blur.", "avoid": "Not for text sitting on the right side.", "sfx": "Whoosh / swish"}, "motion-rise-random": {"title": "Random rise", "use": "Knowledge / book-type lines: each character floats up from a different height.", "avoid": "Gets messy beyond ~8 characters.", "sfx": "Paper rustle"}, "motion-wave-bounce": {"title": "Wave bounce", "use": "Light, playful words: characters bounce in one after another like a wave.", "avoid": "Wrong tone for legal / financial / serious content.", "sfx": "Bubble / pop"}, "motion-typewriter": {"title": "Typewriter", "use": "Definitions, keywords, a \"typing\" feel; the safest pairing is a typing sound (68 uses).", "avoid": "Slow for long lines (0.075 s per character).", "sfx": "Typing sound (one per character)"}, "motion-develop": {"title": "Develop (char by char)", "use": "Calm, literary lines: each character develops from blurry grey to sharp.", "avoid": "Drags beyond ~0.7 s; keep ≤ 8 characters.", "sfx": "None, or water drop / airy"}, "motion-leap": {"title": "Leap in", "use": "Punchy short words: leaps up into place with a little overshoot.", "avoid": "Not for long sentences.", "sfx": "Ding / spring"}, "motion-roll-in": {"title": "Roll in", "use": "Numbers, money, deals: rolls up like a slot machine.", "avoid": "Long text is unreadable mid-roll.", "sfx": "Cash register / coin"}, "motion-tracking-in": {"title": "Tracking in", "use": "Titles and golden lines: characters gather from wide spacing into place — a \"focusing\" feel (52 uses across two variants).", "avoid": "The effect is hard to see with fewer than 3 characters.", "sfx": "Soft whoosh"}, "motion-echo": {"title": "Echo", "use": "Shouts, strong emotion, \"Attention!\": the word pops and sends echo rings outward.", "avoid": "Once or twice per video; not for long lines.", "sfx": "Heavy thud / impact"}, "theme-biz-gold-red": {"title": "Business gold & red", "use": "Law, finance, loans, property, education, business, cars, study-abroad — credible and crisp. Smiley Sans as the main font + gold #ffbf17 / deep red #b71c1c (52% of the industry clips). Entrances lean to fade / grow / shrink / glow-blur; SFX lean to whoosh and impact.", "avoid": "Gold = benefit and red = pain within a layout; don't add a third accent colour.", "sfx": "Whoosh → impact / whirl"}, "theme-guofeng-cream": {"title": "Classical cream", "use": "Wellness, women's emotion / growth, psychology, relationships, yoga, custom homes — gentle and refined. Serif fonts + cream #fff589 / deep red. Entrances lean to fade / grow-soft / curtain / develop; SFX lean to paper and whoosh.", "avoid": "The pack uses Classical / Jinling fonts (not bundled); this library falls back to Source Han Serif Heavy, so the refined feel is weaker.", "sfx": "Paper rustle → whoosh"}, "theme-knowledge-yellow": {"title": "Knowledge yellow", "use": "Paid knowledge, career, founder IP, business coaches, used cars, property agents, reading, tax — bright and practical. Douyin Meihao as the supporting font + bright yellow #fff589 / deep red. Entrances lean to shrink / fade / curtain / blur-left; SFX lean to swish, paper, typing.", "avoid": "The densest pacing (about 78 blocks/min and 54 SFX/min — medians for 15–60 s shorts); don't copy it to long videos.", "sfx": "Swish → typing"}, "emo-cry": {"title": "Cry (emotion loading)", "use": "One word carries a negative emotion: the text starts white and red fills it from the bottom like liquid (about 0.7 s), tracking stretched across the width. For words like \"breakdown\", \"pain\", \"crying\".", "avoid": "1–2 per video; not for long lines; red is the pain colour, so don't stack it on layouts that already use red as the accent.", "sfx": "Heavy thud / sigh"}, "emo-surprise": {"title": "Surprise (wave)", "use": "Surprise and sudden turns: two characters bob out of phase, each tilted about ±8°, looping about 1 s, in gold.", "avoid": "Gets messy with more characters (2–3 is best); wrong tone for serious content.", "sfx": "Surprise sound / pop"}, "emo-joy": {"title": "Joy (text glow)", "use": "Joy, good news, success: pale-yellow text with radiating light rays pulsing in beat behind it, about 1 s per cycle.", "avoid": "The rays wash over what is behind; don't use it together with large B-roll; 1–2 per video.", "sfx": "Ding / magic / cheer"}, "emo-shout": {"title": "Shout (megaphone)", "use": "Shouting, calling for help, \"Attention!\": two characters tilt outward, fade in, then sway gently while echoes ripple outward.", "avoid": "Short words of 2–3 characters only; the echo grows beyond the text, so leave room on both sides.", "sfx": "Heavy thud / impact"}, "glass-hero": {"title": "Glass text (translucent gradient)", "use": "One hero word as \"glass text\": a gold gradient, but the light/dark texture of the picture behind shows through it, like frosted glass. For opening titles, brand words, the one big word in a video.", "avoid": "The picture behind needs light/dark variation (wood grain, brick, curtains) — a flat dark wall barely shows the effect; it must not sit inside a wrapper with transform / opacity / filter (the blend stops working).", "sfx": "Whoosh → magic / sparkle"}, "text-behind": {"title": "Text behind the person (matte)", "use": "Big text placed behind the person: background → text → matte PNG on top, so the person covers part of the text and the frame gains depth. Needs per-frame matting (macOS: Apple Vision).", "avoid": "Don't use it without a matte; put the text inside the same camera container as the video (so it follows hand-shake / push-ins); a frame without

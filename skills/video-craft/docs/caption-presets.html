<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>video-craft 字幕样式预设</title>
<style>
:root{--bg:#0b0a10;--panel:#15131d;--line:#2a2638;--ink:#f2eee4;--muted:#9a95a8;--accent:#ff8a3d}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#f6f2ea;--panel:#fff;--line:#e4dccb;--ink:#1b140c;--muted:#6d6558;--accent:#d2622a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"PingFang SC",sans-serif}
header{padding:28px 16px 12px;max-width:1200px;margin:0 auto}h1{margin:0 0 6px;font-size:26px}p.l{margin:0;color:var(--muted);max-width:760px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}input,button,select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px}button{cursor:pointer}
.grid{max-width:1200px;margin:0 auto;padding:0 16px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0}
.card img{width:100%;display:block;aspect-ratio:9/16;object-fit:cover;background:#0d0b14}.m{padding:8px 10px;font-size:13px}.m b{display:block;font-size:14px}.m span{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--ink);max-width:720px;width:92vw;padding:0}dialog::backdrop{background:rgba(0,0,0,.6)}
.dl{display:grid;grid-template-columns:200px 1fr;gap:16px;padding:18px}@media(max-width:560px){.dl{grid-template-columns:1fr}}.dl img{width:100%;border-radius:10px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;overflow:auto;font:12.5px ui-monospace,Menlo,monospace;max-height:220px}.tag{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.note{color:var(--muted);font-size:13px;margin-top:10px}
</style></head><body>
<header><h1 id="h1"></h1><p class="l" id="lede"></p>
<div class="tools"><input id="q" type="search"><select id="fs"></select><select id="fc"></select><select id="fr"></select><button id="lang"></button></div></header>
<div class="grid" id="grid"></div>
